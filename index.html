<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Collect TCG MY & SG — Inventory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0F1012;
    --sidebar: #131419;
    --surface: #1A1C22;
    --surface-2: #21232B;
    --border: #2A2C34;
    --border-soft: #212329;
    --text: #EFEFF2;
    --text-muted: #8C8F99;
    --accent-gold: #E3B341;
    --accent-gold-soft: #F3D488;
    --accent-teal: #5FD4C4;
    --accent-magenta: #C87DFF;
    --danger: #E8607A;
    --success: #4ADE80;
    --foil: linear-gradient(135deg, #E3B341 0%, #C87DFF 55%, #5FD4C4 100%);
    --r-common: #7A7D86;
    --r-uncommon: #4ADE80;
    --r-rare: #5B9DF9;
    --r-holo: #C87DFF;
    --r-ultra: #E3B341;
    --shadow-card: 0 14px 28px -14px rgba(0,0,0,0.6);
    --shadow-pop: 0 20px 44px -12px rgba(0,0,0,0.65);
  }
  *{box-sizing:border-box;}
  html{scrollbar-color: var(--border) var(--bg); scrollbar-width:thin;}
  body{
    margin:0; background:var(--bg); color:var(--text); font-family:'Inter',sans-serif;
    background-image: radial-gradient(circle at 1px 1px, rgba(255,255,255,0.035) 1px, transparent 0);
    background-size: 24px 24px;
  }
  ::-webkit-scrollbar{width:10px; height:10px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:var(--border); border-radius:6px;}
  ::-webkit-scrollbar-thumb:hover{background:#3a3d47;}
  h1,h2,h3{font-family:'Barlow Condensed', sans-serif; margin:0; letter-spacing:0.5px;}
  a{color:inherit; text-decoration:none;}
  button{font-family:'Inter',sans-serif;}

  /* ---------- Shell ---------- */
  .shell{display:flex; min-height:100vh;}
  .sidebar{
    width:250px; flex-shrink:0; background:var(--sidebar); border-right:1px solid var(--border);
    padding:24px 16px; display:flex; flex-direction:column; gap:28px;
    position:sticky; top:0; height:100vh;
  }
  .brand{display:flex; align-items:center; gap:10px; padding:0 4px;}
  .shop-brand{align-items:center; gap:12px;}
  .shop-logo{
    width:72px; height:72px; object-fit:contain; flex-shrink:0;
    border-radius:50%; filter:drop-shadow(0 0 10px rgba(227,179,65,.28));
  }
  .shop-brand-text{min-width:0;}
  .shop-brand-text h1{
    font-size:20px; line-height:1; color:var(--text); white-space:nowrap;
  }
  .owner-only{display:none !important;}
  body.owner-mode .owner-only{display:flex !important;}
  body.owner-mode a.owner-only{display:flex !important;}
  body.owner-mode .card-actions.owner-only{display:flex !important;}
  .owner-toggle{
    width:100%; margin-top:10px; padding:8px 10px; border-radius:8px;
    border:1px solid var(--border); background:transparent; color:var(--text-muted);
    cursor:pointer; font-size:11px; text-align:left;
  }
  .owner-toggle:hover{color:var(--text);border-color:var(--accent-gold);}
  body.owner-mode .owner-toggle{color:var(--accent-gold);border-color:var(--accent-gold);}
  .owner-status{font-size:9px;color:var(--accent-teal);text-transform:uppercase;letter-spacing:.8px;margin-top:5px;display:none;}
  body.owner-mode .owner-status{display:block;}
  .shop-region{
    margin-top:5px; font-family:'Barlow Condensed',sans-serif; font-size:16px; font-weight:800;
    letter-spacing:1px; color:var(--accent-gold);
  }
  .brand-mark{font-size:23px; color:var(--accent-gold); filter:drop-shadow(0 0 8px rgba(227,179,65,0.55));}
  .brand h1{font-size:22px; font-weight:800; text-transform:uppercase; line-height:1;}
  .brand h1 span{
    background:var(--foil); -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .tagline{margin:4px 0 0 4px; font-size:11px; color:var(--text-muted); letter-spacing:0.2px;}
  nav.mainnav{display:flex; flex-direction:column; gap:2px;}
  nav.mainnav a{
    position:relative; padding:10px 12px 10px 16px; border-radius:9px; font-size:14px;
    color:var(--text-muted); font-weight:500; display:flex; align-items:center; gap:10px;
    transition: color 0.15s ease, background 0.15s ease;
  }
  nav.mainnav a .ic{width:16px; text-align:center; opacity:0.85;}
  nav.mainnav a:hover{color:var(--text); background:rgba(255,255,255,0.035);}
  nav.mainnav a.active{color:var(--text); background:var(--surface);}
  nav.mainnav a.active .ic{color:var(--accent-gold);}
  nav.mainnav a.active::before{
    content:""; position:absolute; left:0; top:7px; bottom:7px; width:3px; border-radius:3px; background:var(--foil);
  }
  .sidebar-footer{margin-top:auto; font-size:11px; color:var(--text-muted); padding:12px 4px 0; line-height:1.6; border-top:1px solid var(--border);}
  .sidebar-footer b{color:var(--text); font-family:'JetBrains Mono',monospace;}

  .main{flex:1; min-width:0; padding:30px 36px 60px;}
  .page-head{display:flex; justify-content:space-between; align-items:flex-end; flex-wrap:wrap; gap:16px; margin-bottom:24px;}
  .eyebrow{font-size:10.5px; color:var(--accent-teal); text-transform:uppercase; letter-spacing:1.4px; font-weight:600; margin-bottom:4px;}
  .page-head h2{font-size:30px;}
  .page-head p{margin:4px 0 0; color:var(--text-muted); font-size:13px;}

  .mono{font-family:'JetBrains Mono',monospace;}

  #view{animation: none;}
  #view.view-enter{animation: viewIn 0.32s ease;}
  @keyframes viewIn{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }

  /* ---------- Stat cards ---------- */
  .stat-strip{display:flex; gap:14px; flex-wrap:wrap; margin-bottom:26px;}
  .stat-card{
    background:var(--surface); border:1px solid var(--border); border-top:2px solid var(--border);
    border-radius:12px; padding:16px 18px; min-width:150px; flex:1;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .stat-card:hover{transform:translateY(-2px); box-shadow:var(--shadow-card);}
  .stat-card:nth-child(1){border-top-color:var(--accent-teal);}
  .stat-card:nth-child(2){border-top-color:var(--accent-gold);}
  .stat-card:nth-child(3){border-top-color:var(--accent-magenta);}
  .stat-card:nth-child(4){border-top-color:var(--success);}
  .stat-card .stat-value{font-family:'JetBrains Mono',monospace; font-size:23px; font-weight:700;}
  .stat-card .stat-label{font-size:11px; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.6px; margin-top:5px;}

  /* ---------- Toolbar ---------- */
  .toolbar{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:22px;}
  .toolbar input[type="text"], .toolbar select{
    background:var(--surface); border:1px solid var(--border); color:var(--text);
    padding:10px 13px; border-radius:9px; font-size:13.5px;
  }
  .toolbar input[type="text"]{flex:1; min-width:180px;}
  .toolbar select{cursor:pointer;}
  .toolbar input:focus, .toolbar select:focus{outline:2px solid var(--accent-teal); outline-offset:1px;}

  .btn-primary{
    background: linear-gradient(135deg, var(--accent-gold), var(--accent-gold-soft));
    color:#1a1608; border:none; font-weight:700;
    padding:10px 17px; border-radius:9px; cursor:pointer; font-size:13.5px; white-space:nowrap;
    transition: transform 0.12s ease, box-shadow 0.12s ease;
  }
  .btn-primary:hover{transform:translateY(-1px); box-shadow:0 6px 18px -4px rgba(227,179,65,0.45);}
  .btn-primary:focus-visible{outline:2px solid var(--accent-teal); outline-offset:2px;}
  .btn-ghost{
    background:transparent; border:1px solid var(--border); color:var(--text-muted);
    padding:9px 14px; border-radius:9px; cursor:pointer; font-size:13px;
  }
  .btn-ghost:hover{color:var(--text); border-color:var(--text-muted);}
  .btn-danger-text{background:none; border:none; color:var(--danger); cursor:pointer; font-size:12.5px; padding:6px 0;}

  /* ---------- Grid / cards ---------- */
  .grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(250px,1fr)); gap:18px;}
  .card{
    position:relative; background:var(--surface); border:1px solid var(--border); border-radius:12px;
    padding:13px 15px 13px 17px; overflow:hidden; transition:border-color 0.15s ease, transform 0.15s ease, box-shadow 0.15s ease;
    display:flex; gap:12px;
  }
  .card:hover{transform:translateY(-3px); border-color:#3a3d47; box-shadow:var(--shadow-card);}
  .card{cursor:pointer;}
  .card button,.card a{cursor:pointer;}
  .thumb-wrap{width:112px;flex-shrink:0;}
  @media(max-width:600px){
    .thumb,.thumb-placeholder{width:88px;height:122px;}
    .thumb-wrap{width:88px;}
  }
  .card-details-modal{max-width:820px;}
  .detail-header{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:18px;}
  .detail-title{min-width:0;}
  .detail-title h2{font-size:28px;margin-bottom:4px;}
  .detail-meta{color:var(--text-muted);font-size:12.5px;}
  .detail-layout{display:grid;grid-template-columns:minmax(260px,1fr) minmax(260px,1fr);gap:18px;}
  .detail-gallery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;align-content:start;}
  .detail-image{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:10px;border:1px solid var(--border);background:var(--bg);cursor:zoom-in;}
  .detail-image:first-child{grid-column:1/-1;aspect-ratio:4/3;}
  .detail-empty-image{min-height:180px;border:1px dashed var(--border);border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--text-muted);font-size:12px;}
  .detail-info{display:flex;flex-direction:column;gap:10px;}
  .detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .detail-item{background:var(--bg);border:1px solid var(--border);border-radius:9px;padding:10px;}
  .detail-label{font-size:9.5px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px;}
  .detail-value{font-size:13px;font-weight:600;word-break:break-word;}
  .detail-section{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:12px;}
  .detail-section h3{font-size:14px;margin-bottom:9px;}
  .grade-entry{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);font-size:12px;}
  .grade-entry:last-child{border-bottom:none;padding-bottom:0;}
  .grade-entry:first-child{padding-top:0;}
  .grade-main{font-weight:700;color:var(--accent-gold);}
  .grade-cert{color:var(--text-muted);font-family:'JetBrains Mono',monospace;font-size:10.5px;text-align:right;}
  .detail-notes{color:var(--text-muted);font-size:12px;line-height:1.5;white-space:pre-wrap;}
  @media(max-width:700px){.detail-layout{grid-template-columns:1fr;}.detail-gallery{grid-template-columns:repeat(3,minmax(0,1fr));}.detail-image:first-child{grid-column:1/-1;}}
  .card::before{content:""; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--stripe, var(--r-common));}
  .card.shimmer::after{
    content:""; position:absolute; inset:0; pointer-events:none;
    background: radial-gradient(180px 180px at var(--mx,50%) var(--my,50%), rgba(255,255,255,0.16), rgba(192,132,252,0.08) 40%, transparent 70%);
    opacity:0; transition:opacity 0.2s ease;
  }
  .card.shimmer:hover::after{opacity:1;}
  .thumb{
    width:112px; height:154px; border-radius:8px; object-fit:cover; flex-shrink:0; background:var(--surface-2); border:1px solid var(--border);
  }
  .thumb-placeholder{
    width:112px; height:154px; border-radius:8px; flex-shrink:0; display:flex; align-items:center; justify-content:center;
    background:var(--surface-2); border:1px solid var(--border); font-family:'Barlow Condensed',sans-serif;
    font-weight:700; font-size:20px; color:var(--stripe, var(--r-common));
  }
  .card-body{flex:1; min-width:0;}
  .card-top{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
  .card-name{font-family:'Barlow Condensed', sans-serif; font-weight:700; font-size:18px; line-height:1.15;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .card-meta{color:var(--text-muted); font-size:11.5px; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .badge{
    display:inline-block; font-size:10px; font-weight:600; text-transform:uppercase; letter-spacing:0.4px;
    padding:2px 8px; border-radius:20px; white-space:nowrap; flex-shrink:0;
    background:rgba(255,255,255,0.06); color:var(--stripe, var(--r-common)); border:1px solid currentColor;
  }
  .badge.foil{background:var(--foil); color:#171310; border:none; font-weight:700;}
  .card-row{display:flex; justify-content:space-between; align-items:center; margin-top:11px;}
  .qty-price{display:flex; gap:12px; align-items:baseline;}
  .qty{font-family:'JetBrains Mono',monospace; font-size:12.5px; color:var(--text-muted);}
  .qty b{color:var(--text);}
  .price{font-family:'JetBrains Mono',monospace; font-size:15px; font-weight:700; color:var(--accent-gold);}
  .low-stock{color:var(--danger); font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:0.4px; margin-top:6px;}
  .card-actions{display:flex; gap:6px;}
  .icon-btn{
    background:transparent; border:1px solid var(--border); color:var(--text-muted);
    width:26px; height:26px; border-radius:7px; cursor:pointer; font-size:12px;
    display:flex; align-items:center; justify-content:center; transition: color 0.12s ease, border-color 0.12s ease;
  }
  .icon-btn:hover{color:var(--text); border-color:var(--text-muted);}
  .condition-tag{font-size:10.5px; color:var(--text-muted); margin-top:2px;}
  .notes{font-size:11px; color:var(--text-muted); margin-top:8px; font-style:italic; line-height:1.4;
    overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;}

  /* ---------- Image-first inventory cards ---------- */
  .grid .card{
    display:block;
    padding:0;
    overflow:hidden;
    border-radius:14px;
  }
  .grid .card > .thumb-wrap,
  .grid .card > .thumb-placeholder{
    width:100% !important;
    height:auto !important;
    aspect-ratio:5 / 7;
    border-radius:0;
    border:0;
    border-bottom:1px solid var(--border);
    background:var(--surface-2);
  }
  .grid .card > .thumb-wrap .thumb{
    width:100% !important;
    height:100% !important;
    aspect-ratio:5 / 7;
    object-fit:cover;
    border:0 !important;
    border-radius:0;
    display:block;
  }
  .grid .card > .thumb-placeholder{
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:42px;
  }
  .grid .card .card-body{
    padding:12px 13px 13px;
  }
  .grid .card .card-top{
    display:block;
  }
  .grid .card .card-name{
    font-size:18px;
    margin-bottom:2px;
  }
  .grid .card .badge{
    display:inline-block;
    margin-top:7px;
  }
  .grid .card .card-row{
    margin-top:11px;
    padding-top:10px;
    border-top:1px solid var(--border-soft);
    display:block;
  }
  .grid .card .qty-price{
    width:100%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
  }
  .grid .card .qty{
    order:2;
    font-size:11.5px;
  }
  .grid .card .price{
    order:1;
    font-size:17px;
  }
  .grid .card .card-actions{
    margin-top:9px;
    justify-content:flex-end;
  }
  .grid .card .low-stock{
    margin-top:8px;
  }
  .grid .card .notes{
    margin-top:7px;
  }
  .grid .card .grade-summary{
    margin-top:6px;
  }
  @media(max-width:600px){
    .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;}
    .grid .card .card-body{padding:9px 10px 10px;}
    .grid .card .card-name{font-size:16px;}
    .grid .card .card-meta,.grid .card .condition-tag{font-size:10px;}
    .grid .card .price{font-size:14px;}
    .grid .card .qty{font-size:10px;}
  }

  /* ---------- Compact card information ---------- */
  .grid .card .card-body{
    padding:7px 10px 9px;
  }
  .grid .card .card-row{
    margin-top:0;
    padding-top:0;
    border-top:0;
  }
  .grid .card .qty-price{
    line-height:1.1;
  }
  .grid .card .price{
    font-size:15px;
    line-height:1.15;
  }
  .grid .card .qty{
    font-size:10px;
    line-height:1.15;
  }
  .grid .card .card-top{
    margin-top:4px !important;
  }
  .grid .card .card-name{
    font-size:16px;
    line-height:1.05;
    margin:0;
  }
  .grid .card .card-meta{
    font-size:9.5px;
    line-height:1.15;
    margin-top:2px;
  }
  .grid .card .condition-tag{
    font-size:9px;
    line-height:1.1;
    margin-top:2px;
  }
  .grid .card .badge{
    font-size:8px;
    padding:2px 6px;
    margin-top:4px;
  }
  .grid .card .grade-summary{
    font-size:9px;
    margin-top:3px;
    line-height:1.15;
  }
  .grid .card .notes{
    font-size:9px;
    margin-top:3px;
    line-height:1.2;
    -webkit-line-clamp:1;
  }
  .grid .card .low-stock{
    font-size:8px;
    margin-top:4px;
  }
  .grid .card .card-actions{
    margin-top:4px;
  }
  @media(max-width:600px){
    .grid .card .card-body{padding:6px 8px 8px;}
    .grid .card .price{font-size:13px;}
    .grid .card .card-name{font-size:14px;}
    .grid .card .card-meta{font-size:8.5px;}
    .grid .card .condition-tag{font-size:8px;}
  }

  /* ---------- Tighter price/name + slightly smaller thumbnails ---------- */
  .grid{
    grid-template-columns:repeat(auto-fill, minmax(235px,1fr));
    gap:16px;
  }
  .grid .card > .thumb-wrap,
  .grid .card > .thumb-placeholder{
    aspect-ratio:5 / 6.5;
  }
  .grid .card > .thumb-wrap .thumb{
    aspect-ratio:5 / 6.5;
  }
  .grid .card .card-body{
    padding:6px 9px 8px;
  }
  .grid .card .card-row{
    margin:0;
    padding:0;
    line-height:1;
  }
  .grid .card .qty-price{
    margin:0;
    padding:0;
  }
  .grid .card .price,
  .grid .card .qty{
    margin:0;
    padding:0;
  }
  .grid .card .card-top{
    margin-top:2px !important;
    padding-top:0;
  }
  .grid .card .card-name{
    margin:0;
    padding:0;
    line-height:1.05;
  }
  @media(max-width:600px){
    .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;}
    .grid .card > .thumb-wrap,
    .grid .card > .thumb-placeholder,
    .grid .card > .thumb-wrap .thumb{aspect-ratio:5 / 6.6;}
  }

  /* ---------- Clean owner controls: no extra card spacing ---------- */
  .grid .card{
    position:relative;
  }
  .grid .card .card-actions.owner-only{
    position:absolute;
    top:7px;
    right:7px;
    z-index:4;
    margin:0;
    padding:4px;
    gap:4px;
    border-radius:9px;
    background:rgba(15,16,18,.88);
    backdrop-filter:blur(5px);
    border:1px solid rgba(255,255,255,.10);
  }
  .grid .card .card-actions.owner-only .icon-btn{
    width:25px;
    height:25px;
    background:var(--surface-2);
  }
  .grid .card .card-body{
    padding:6px 9px 8px;
  }
  .grid .card .card-row{
    margin:0;
    padding:0;
  }
  .grid .card .card-top{
    margin-top:3px !important;
  }
  .grid .card .qty-price{
    min-height:0;
    line-height:1;
  }

  /* ---------- Single-line card metadata ---------- */
  .grid .card .card-meta-one-line{
    display:flex;
    align-items:center;
    gap:4px;
    margin-top:3px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    font-size:9px;
    line-height:1.2;
    color:var(--text-muted);
  }
  .grid .card .card-meta-one-line span{
    flex:0 0 auto;
  }
  @media(max-width:600px){
    .grid .card .card-meta-one-line{
      font-size:7.5px;
      gap:2px;
    }
  }

  .grid .card .grade-summary{
    display:inline-block;
    margin-top:4px;
    padding:2px 6px;
    border-radius:6px;
    background:rgba(95,212,196,.08);
    border:1px solid rgba(95,212,196,.22);
    color:var(--accent-teal);
    font-size:9px;
    line-height:1.2;
    font-weight:600;
  }

  /* ---------- Image lightbox ---------- */
  .image-lightbox{
    position:fixed;
    inset:0;
    z-index:100;
    background:rgba(0,0,0,.92);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .image-lightbox[hidden]{display:none !important;}
  .image-lightbox img{
    max-width:min(92vw,1100px);
    max-height:90vh;
    object-fit:contain;
    border-radius:10px;
    box-shadow:0 20px 60px rgba(0,0,0,.65);
  }
  .image-lightbox-close{
    position:fixed;
    top:18px;
    right:20px;
    width:38px;
    height:38px;
    border-radius:50%;
    border:1px solid rgba(255,255,255,.2);
    background:rgba(20,20,24,.8);
    color:#fff;
    font-size:22px;
    cursor:pointer;
  }

  /* ---------- Detail image slider ---------- */
  .detail-slider{
    position:relative;
    width:100%;
  }
  .detail-slider-stage{
    width:100%;
    aspect-ratio:4/3;
    border-radius:12px;
    overflow:hidden;
    background:var(--bg);
    border:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .detail-slider-stage img{
    width:100%;
    height:100%;
    object-fit:contain;
    cursor:zoom-in;
    display:block;
  }
  .detail-slider-btn{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    width:34px;
    height:34px;
    border-radius:50%;
    border:1px solid rgba(255,255,255,.18);
    background:rgba(15,16,18,.78);
    color:#fff;
    cursor:pointer;
    z-index:3;
    font-size:18px;
  }
  .detail-slider-btn.prev{left:8px;}
  .detail-slider-btn.next{right:8px;}
  .detail-slider-dots{
    display:flex;
    justify-content:center;
    gap:5px;
    margin-top:8px;
  }
  .detail-slider-dot{
    width:7px;
    height:7px;
    border-radius:50%;

    border:0;
    padding:0;
    cursor:pointer;

  .detail-slider-count{
    position:absolute;
    right:8px;
    bottom:8px;
    padding:3px 6px;
    border-radius:6px;
    background:rgba(0,0,0,.65);
    color:#fff;
    font:9px 'JetBrains Mono',monospace;
  }

  /* ---------- About page ---------- */
  .about-copy p{
    margin:0 0 13px;
    color:var(--text-muted);
    font-size:13.5px;
    line-height:1.75;
  }
  .about-subhead{
    margin-top:26px !important;
    margin-bottom:11px !important;
  }
  .about-links{
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:9px;
  }
  .about-link{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:12px 13px;
    border:1px solid var(--border);
    border-radius:10px;
    background:var(--surface-2);
    color:var(--text);
    text-decoration:none;
    font-size:12px;
  }
  .about-link:hover{border-color:var(--accent-gold);}
  .about-link b{display:block;}
  .about-link small{
    display:block;
    margin-top:3px;
    color:var(--text-muted);
    font-size:9.5px;
    font-weight:400;
  }
  .about-link > span:last-child{color:var(--accent-gold);font-size:15px;}
  .cod-rules{
    margin:0;
    padding-left:22px;
    color:var(--text-muted);
    font-size:12.5px;
    line-height:1.65;
  }
  .cod-rules li{padding-left:5px;margin-bottom:8px;}
  .cod-rules b{color:var(--text);}
  @media(max-width:760px){
    .about-links{grid-template-columns:1fr;}
  }

  /* ---------- Contact links ---------- */
  .contact-links{display:grid;gap:9px;margin-top:12px;}
  .contact-link{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:12px 14px;border:1px solid var(--border);border-radius:10px;
    background:var(--surface-2);color:var(--text);text-decoration:none;
    font-size:13px;font-weight:600;transition:.15s ease;
  }
  .contact-link:hover{border-color:var(--accent-gold);transform:translateY(-1px);}
  .contact-arrow{color:var(--accent-gold);font-size:15px;}

  /* ---------- Larger card detail view + full gallery lightbox ---------- */
  .card-details-modal{
    max-width:1120px;
    width:min(96vw,1120px);
    padding:24px;

    grid-template-columns:minmax(430px,1.35fr) minmax(300px,.8fr);
    gap:24px;
    align-items:start;

    aspect-ratio:4 / 5;
    max-height:72vh;
    background:#111216;
  }
  .detail-slider-stage img{
    object-fit:contain;
    padding:6px;
  }
  .detail-slider-btn{
    width:42px;
    height:42px;
    font-size:25px;
    background:rgba(10,10,12,.82);
  }
  .detail-slider-btn.prev{left:12px;}
  .detail-slider-btn.next{right:12px;}
  .detail-slider-count{
    right:12px;
    bottom:12px;
    font-size:10px;
    padding:4px 7px;
  }
  .detail-slider-dots{margin-top:10px;}

  .image-lightbox{
    flex-direction:column;
    gap:12px;
    padding:22px 76px 18px;
  }
  .image-lightbox-main{
    position:relative;
    width:100%;
    height:calc(100vh - 150px);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .image-lightbox img#imageLightboxImg{
    max-width:100%;
    max-height:100%;
    width:auto;
    height:auto;
    object-fit:contain;
    border-radius:10px;
  }
  .image-lightbox-nav{
    position:fixed;
    top:50%;
    transform:translateY(-50%);
    width:52px;
    height:52px;
    border-radius:50%;

    color:#fff;
    font-size:31px;
    cursor:pointer;
    z-index:102;

  .image-lightbox-prev{left:18px;}
  .image-lightbox-next{right:18px;}
  .image-lightbox-nav:hover{border-color:var(--accent-gold);color:var(--accent-gold);}
  .image-lightbox-count{
    position:fixed;
    top:22px;
    left:24px;
    color:#fff;
    font:12px 'JetBrains Mono',monospace;
    z-index:102;
    background:rgba(20,20,24,.68);
    padding:5px 8px;
    border-radius:7px;

  .image-lightbox-thumbs{
    width:min(760px,90vw);
    display:flex;
    justify-content:center;
    gap:8px;
    overflow-x:auto;
    padding:4px 2px 7px;
  }
  .image-lightbox-thumb{
    width:58px;
    height:76px;
    flex:0 0 auto;
    object-fit:cover;
    padding:0 !important;
    border-radius:7px !important;
    border:1px solid var(--border) !important;
    opacity:.55;
    cursor:pointer;
    box-shadow:none !important;
  }
  .image-lightbox-thumb.active{
    opacity:1;
    border-color:var(--accent-gold) !important;
    box-shadow:0 0 0 1px var(--accent-gold) !important;

  .image-lightbox-hint{
    color:rgba(255,255,255,.65);
    font-size:11px;
    text-align:center;
  }
  @media(max-width:800px){

    .image-lightbox{padding:18px 48px 14px;}
    .image-lightbox-main{height:calc(100vh - 130px);}
    .image-lightbox-nav{width:42px;height:42px;font-size:25px;}
    .image-lightbox-prev{left:6px;}
    .image-lightbox-next{right:6px;}
    .image-lightbox-thumb{width:48px;height:64px;}

  /* ---------- By-game groups ---------- */
  .game-group{margin-bottom:32px;}
  .game-group-head{display:flex; align-items:center; gap:10px; margin-bottom:13px;}
  .game-group-head h3{font-size:20px;}

  .game-group-head hr{flex:1; border:none; border-top:1px solid var(--border);}

  /* ---------- Dashboard bars ---------- */
  .panel{background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:20px; margin-bottom:18px;}
  .panel h3{font-size:17px; margin-bottom:15px;}
  .bar-row{display:grid; grid-template-columns:110px 1fr 70px; align-items:center; gap:10px; margin-bottom:11px; font-size:12.5px;}
  .bar-row .lbl{color:var(--text-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .bar-track{background:var(--surface-2); border-radius:6px; height:9px; overflow:hidden;}
  .bar-fill{height:100%; background:var(--accent-teal); border-radius:6px; transition: width 0.4s ease;}
  .bar-val{text-align:right; font-family:'JetBrains Mono',monospace; color:var(--text);}
  .dashboard-grid{display:grid; grid-template-columns:1fr 1fr; gap:18px;}
  @media (max-width:900px){.dashboard-grid{grid-template-columns:1fr;}}
  .recent-row{display:flex; justify-content:space-between; align-items:center; padding:9px 0; border-bottom:1px solid var(--border); font-size:13px;}
  .recent-row:last-child{border-bottom:none;}
  .recent-row .rn{font-weight:600;}
  .recent-row .rm{color:var(--text-muted); font-size:11.5px;}

  /* ---------- Empty state ---------- */
  .empty-state{
    text-align:center; padding:64px 20px; color:var(--text-muted); border:1px dashed var(--border); border-radius:14px;
    display:flex; flex-direction:column; align-items:center;
  }
  .empty-state svg{margin-bottom:14px; opacity:0.9;}
  .empty-state h2{font-size:24px; color:var(--text); margin-bottom:6px;}
  .empty-state p{margin:0 0 18px; font-size:13.5px; max-width:320px;}

  /* ---------- Form / Add page & Modal ---------- */
  .form-card{background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:26px; max-width:640px;}

    padding:9px 11px; border-radius:9px; font-size:13.5px; font-family:'Inter',sans-serif;
  }
  .field textarea{resize:vertical; min-height:50px;}
  .field input:focus, .field select:focus, .field textarea:focus{outline:2px solid var(--accent-teal); outline-offset:1px;}
  .field-row{display:flex; gap:10px;}
  .field-row .field{flex:1;}
  .hint{font-size:10.5px; color:var(--text-muted); margin-top:4px;}

  .image-field{display:block; margin-bottom:18px;}
  .image-gallery-preview{
    display:grid; grid-template-columns:repeat(auto-fill,minmax(82px,1fr)); gap:8px;
    margin-bottom:10px;
  }
  .image-preview-box{
    position:relative; width:100%; aspect-ratio:1; min-height:82px; border-radius:10px; background:var(--bg);
    border:1px dashed var(--border); display:flex; align-items:center; justify-content:center;
    overflow:hidden; color:var(--text-muted); font-size:11px; text-align:center;
  }
  .image-preview-box img{width:100%; height:100%; object-fit:cover;}
  .image-preview-box .image-remove{
    position:absolute; top:4px; right:4px; width:22px; height:22px; border-radius:50%;
    border:1px solid rgba(255,255,255,.18); background:rgba(0,0,0,.72); color:#fff;
    cursor:pointer; line-height:18px; padding:0; font-size:12px;
  }
  .image-preview-box .image-number{
    position:absolute; bottom:4px; left:4px; padding:2px 5px; border-radius:5px;
    background:rgba(0,0,0,.68); color:#fff; font:10px 'JetBrains Mono',monospace;
  }
  .image-controls{display:flex; flex-direction:column; gap:8px;}
  .image-controls input[type="file"]{font-size:12px; color:var(--text-muted);}
  .image-controls input[type="text"]{
    background:var(--bg); border:1px solid var(--border); color:var(--text); padding:8px 10px; border-radius:8px; font-size:12.5px;
  }
  .image-url-row{display:flex; gap:8px;}
  .image-url-row input{flex:1;}
  .image-gallery-note{font-size:10.5px; color:var(--text-muted); margin-top:2px;}
  .grading-section{
    margin:18px 0; padding:14px; background:rgba(255,255,255,.025); border:1px solid var(--border);
    border-radius:10px;
  }
  .grading-head{display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:10px;}
  .grading-head h3{font-size:15px;}
  .grading-row{
    display:grid; grid-template-columns:1fr 1fr 1.25fr auto; gap:8px; align-items:end; margin-bottom:8px;
  }
  .grading-row:last-child{margin-bottom:0;}
  .grading-row select,.grading-row input{
    width:100%; background:var(--bg); border:1px solid var(--border); color:var(--text);
    padding:8px 9px; border-radius:8px; font-size:12px;
  }
  .grading-row .field{margin-bottom:0;}
  .grading-remove{height:34px; padding:0 9px; border:1px solid var(--border); background:transparent; color:var(--danger); border-radius:8px; cursor:pointer;}
  .grade-summary{font-size:10.5px; color:var(--accent-teal); margin-top:5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  @media (max-width:600px){
    .grading-row{grid-template-columns:1fr 1fr auto;}
    .grading-row .cert-field{grid-column:1 / -1;}
  }

  .modal-actions{display:flex; justify-content:flex-end; gap:10px; margin-top:18px;}
  .modal-actions button[type="button"]{
    background:transparent; border:1px solid var(--border); color:var(--text-muted);
    padding:10px 16px; border-radius:9px; cursor:pointer; font-size:13.5px;
  }
  .modal-actions button[type="button"]:hover{color:var(--text);}

  .modal-overlay{position:fixed; inset:0; background:rgba(6,6,8,0.72); backdrop-filter: blur(2px); display:flex; align-items:center; justify-content:center; padding:20px; z-index:50;}
  .modal-overlay[hidden]{display:none !important;}
  .modal{background:var(--surface-2); border:1px solid var(--border); border-radius:16px; padding:26px; width:100%; max-width:480px; max-height:88vh; overflow-y:auto; box-shadow:var(--shadow-pop); animation: viewIn 0.22s ease;}
  .modal h2{font-size:22px; margin-bottom:16px;}

  /* ---------- Stacked card details: gallery first, info below ---------- */
  .modal.card-details-modal{
    width:min(94vw,900px);
    max-width:min(94vw,900px);
    max-height:92vh;
    overflow-y:auto;
    overflow-x:hidden;
  }
  .modal.card-details-modal .detail-layout{
    display:grid !important;
    grid-template-columns:1fr !important;
    gap:16px !important;
    width:100%;
  }
  .modal.card-details-modal .detail-layout > *{
    min-width:0;
    width:100%;
  }
  .modal.card-details-modal .detail-slider{
    width:100%;
    max-width:760px;
    margin:0 auto;
  }
  .modal.card-details-modal .detail-slider-stage{
    width:100%;
    aspect-ratio:4 / 5;
    max-height:72vh;
  }
  .modal.card-details-modal .detail-info{
    width:100%;
    max-width:760px;
    margin:0 auto;
  }
  .modal.card-details-modal .detail-grid{
    grid-template-columns:repeat(3,minmax(0,1fr));
  }
  @media(max-width:760px){
    .modal.card-details-modal{
      width:100%;
      max-width:100%;
      padding:14px;
    }
    .modal.card-details-modal .detail-slider-stage{
      max-height:62vh;
    }
    .modal.card-details-modal .detail-grid{
      grid-template-columns:repeat(2,minmax(0,1fr));
    }
  }
  @media(max-width:460px){
    .modal.card-details-modal .detail-grid{
      grid-template-columns:1fr 1fr;
    }
  }

  /* ---------- Responsive card details modal ---------- */
  .modal.card-details-modal{
    width:min(94vw,1080px);
    max-width:min(94vw,1080px);
    max-height:92vh;
    overflow-y:auto;
    overflow-x:hidden;
    padding:22px;
  }
  .modal.card-details-modal .detail-layout{
    display:grid;
    grid-template-columns:minmax(0,1.35fr) minmax(0,.9fr);
    gap:20px;
    width:100%;
    min-width:0;
    align-items:start;
  }
  .modal.card-details-modal .detail-layout > *{
    min-width:0;
  }
  .modal.card-details-modal .detail-slider-stage{
    width:100%;
    max-height:68vh;
    aspect-ratio:4 / 5;
  }
  .modal.card-details-modal .detail-info{
    min-width:0;
  }
  .modal.card-details-modal .detail-grid{
    grid-template-columns:repeat(2,minmax(0,1fr));
  }

  @media(max-width:980px){
    .modal.card-details-modal{
      width:min(96vw,820px);
      max-width:min(96vw,820px);
      padding:18px;
    }
    .modal.card-details-modal .detail-layout{
      grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);
      gap:14px;
    }
    .modal.card-details-modal .detail-slider-stage{
      max-height:60vh;
    }
  }

  @media(max-width:760px){
    .modal-overlay{

    }

      max-width:100%;

      border-radius:12px;

      grid-template-columns:1fr;
      gap:14px;
    }
    .modal.card-details-modal .detail-slider-stage{
      max-height:58vh;

    .modal.card-details-modal .detail-grid{

      grid-template-columns:1fr 1fr;

  }

  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--surface-2); border:1px solid var(--border);
    color:var(--text); padding:11px 18px; border-radius:9px; font-size:13px; z-index:60; box-shadow:var(--shadow-pop);
  }

  /* ---------- Mobile ---------- */
  .hamburger{display:none;}
  @media (max-width:800px){
    .shell{flex-direction:column;}
    .sidebar{
      width:100%; height:auto; position:sticky; top:0; z-index:40; flex-direction:row; align-items:center;
      padding:12px 16px; gap:14px; overflow-x:auto;

    gap:8px;
  }
  .modal.card-details-modal .detail-section{
    margin-top:2px;
  }

  // ---------------- Image helpers ----------------
  function resizeImageFile(file, maxDim, quality){
    return new Promise((resolve, reject)=>{
      const reader = new FileReader();
      reader.onerror = () => reject(new Error("read failed"));
      reader.onload = () => {
        const img = new Image();
        img.onerror = () => reject(new Error("decode failed"));
        img.onload = () => {
          let w = img.width, h = img.height;
          if(w > h && w > maxDim){ h = Math.round(h * maxDim / w); w = maxDim; }
          else if(h >= w && h > maxDim){ w = Math.round(w * maxDim / h); h = maxDim; }
          const canvas = document.createElement("canvas");
          canvas.width = w; canvas.height = h;
          canvas.getContext("2d").drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL("image/jpeg", quality));
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  function wireImageControls(p, formState){
    const fileInput = $(p + "ImageFile");
    const urlInput = $(p + "ImageUrl");
    const addUrlBtn = $(p + "AddImageUrl");
    const preview = $(p + "ImageGalleryPreview");

    function refreshPreview(){
      preview.innerHTML = "";
      if(!formState.images.length){
        const empty = document.createElement("div");
        empty.className = "image-preview-box";
        empty.textContent = "No images";
        preview.appendChild(empty);
        return;
      }
      formState.images.forEach((image, index)=>{
        const box = document.createElement("div");
        box.className = "image-preview-box";
        box.innerHTML = `<img src="${escapeHtml(image)}" alt="Image ${index+1}">
          <span class="image-number">${index+1}</span>
          <button type="button" class="image-remove" title="Remove image">×</button>`;
        box.querySelector(".image-remove").addEventListener("click", ()=>{
          formState.images.splice(index, 1);
          refreshPreview();
        });
        preview.appendChild(box);
      });
    }

    fileInput.addEventListener("change", async ()=>{
      const files = Array.from(fileInput.files || []);
      if(!files.length) return;
      try{
        for(const file of files){
          formState.images.push(await resizeImageFile(file, 900, 0.78));
        }
        fileInput.value = "";
        refreshPreview();
      }catch(e){ showToast("Couldn't read one of the images."); }
    });

    function addUrl(){
      const val = urlInput.value.trim();
      if(!val) return;
      formState.images.push(val);
      urlInput.value = "";
      refreshPreview();
    }

    addUrlBtn.addEventListener("click", addUrl);
    urlInput.addEventListener("keydown", e=>{
      if(e.key === "Enter"){
        e.preventDefault();
        addUrl();
      }
    });

    refreshPreview();
  }

  // ---------------- Inventory ----------------
  function getFiltered(){
    const q = ($("search") && $("search").value.trim().toLowerCase()) || "";
    const gameF = ($("filterGame") && $("filterGame").value) || "";
    const rarityF = ($("filterRarity") && $("filterRarity").value) || "";
    const sortBy = ($("sortBy") && $("sortBy").value) || "name";

    let list = cards.filter(c=>{
      if(gameF && c.game !== gameF) return false;
      if(rarityF && c.rarity !== rarityF) return false;
      if(q && !(c.name.toLowerCase().includes(q) || (c.set||"").toLowerCase().includes(q))) return false;
      return true;
    });
    list.sort((a,b)=>{
      switch(sortBy){
        case "value": return (b.qty*b.price) - (a.qty*a.price);
        case "price": return b.price - a.price;
        case "qty": return b.qty - a.qty;
        case "rarity": return RARITY_LIST.indexOf(b.rarity) - RARITY_LIST.indexOf(a.rarity);
        default: return a.name.localeCompare(b.name);
      }
    });
    return list;
  }

  function wireShimmer(container){
    container.querySelectorAll('.card[data-shimmer="true"]').forEach(el=>{
      el.addEventListener("mousemove", (e)=>{
        const r = el.getBoundingClientRect();
        el.style.setProperty("--mx", ((e.clientX - r.left)/r.width*100) + "%");
        el.style.setProperty("--my", ((e.clientY - r.top)/r.height*100) + "%");
      });
    });
  }

  function wireCardActions(container){
    container.addEventListener("click", async (e)=>{
      const btn = e.target.closest("button[data-action]");
      if(btn){
        e.stopPropagation();
        const id = btn.dataset.id;
        const card = cards.find(c=>c.id === id);
        if(!card) return;
        if(btn.dataset.action === "edit"){
          openEditModal(card);
        } else if(btn.dataset.action === "delete"){
          if(confirm(`Remove "${card.name}" from your inventory?`)){
            if(!isOwnerMode()){ showToast("Owner login required"); return; }
            const ok = await deleteCardStorage(id);
            if(ok){
              cards = cards.filter(c=>c.id !== id);
              router();
              showToast("Card removed");
            }
          }
        }
        return;
      }

      const tile = e.target.closest(".card[data-card-id]");
      if(!tile) return;
      const card = cards.find(c=>c.id === tile.dataset.cardId);
      if(card) openDetailsModal(card);
    });
  }

  // ---------------- By Game ----------------
  function renderByGamePage(){
    view.innerHTML = `<div class="page-head"><div><div class="eyebrow">Organize</div><h2>By Game</h2><p>Collect TCG MY & SG inventory, organized by game.</p></div></div><div id="byGameMount"></div>`;
    const mount = $("byGameMount");
    if(cards.length === 0){
      mount.innerHTML = `<div class="empty-state">${EMPTY_ICON}<h2>Nothing to group yet</h2><p>Add a few cards and they'll be sorted here by game.</p><a href="#/add" class="btn-primary" style="display:inline-block;">+ Add a card</a></div>`;
      return;
    }
    const byGame = {};
    cards.forEach(c=>{ (byGame[c.game] = byGame[c.game] || []).push(c); });
    const games = Object.keys(byGame).sort();
    mount.innerHTML = games.map(g=>{
      const list = byGame[g].slice().sort((a,b)=>a.name.localeCompare(b.name));
      return `
        <div class="game-group">
          <div class="game-group-head"><h3>${escapeHtml(g)}</h3><span class="count">${list.length} listing${list.length===1?"":"s"}</span><hr></div>
          <div class="grid">${list.map(cardTileHTML).join("")}</div>
        </div>
      `;
    }).join("");
    wireShimmer(mount);
  }

  // ---------------- Add page ----------------
  function renderAddPage(){
    view.innerHTML = `
      <div class="page-head"><div><div class="eyebrow">New listing</div><h2>Add a card</h2><p>List a new card in your inventory.</p></div></div>
      <form class="form-card" id="addForm">
        ${fieldsTemplate("add")}
        <div class="modal-actions">
          <a href="#/inventory" class="btn-ghost" style="text-decoration:none; display:inline-flex; align-items:center;">Cancel</a>
          <button type="submit" class="btn-primary">Save card</button>
        </div>
      </form>
    `;
    const formState = { images: [], grading: [] };
    wireImageControls("add", formState);
    wireGradingControls("add", formState);
    $("addForm").addEventListener("submit", async (e)=>{
      e.preventDefault();
      const data = collectFields("add", null, formState);
      if(!data.name || !data.game) return;
      if(!isOwnerMode()){ showToast("Owner login required"); return; }

      const saved = await createCardStorage(data);
      if(saved){
        cards.push(saved);
        showToast("Card added");
        location.hash = "#/inventory";
      }
    });
  }

  // ---------------- Card details modal ----------------
  const detailsOverlay = $("detailsOverlay");
  const detailsMount = $("detailsMount");
  let detailsCardId = null;

  function gradingDetailsHTML(card){
    const grades = Array.isArray(card.grading) ? card.grading.filter(g=>g && g.company) : [];
    if(!grades.length){
      return `<div class="detail-section"><h3>Grading</h3><div class="hint">Raw / ungraded card — no grading entry recorded.</div></div>`;
    }
    return `<div class="detail-section"><h3>Grading</h3>${
      grades.map(g=>`<div class="grade-entry">
        <div><span class="grade-main">${escapeHtml(g.company)} ${escapeHtml(g.grade || "")}</span></div>
        <div class="grade-cert">${g.cert ? "Cert. #"+escapeHtml(g.cert) : "No cert. number"}</div>
      </div>`).join("")
    }</div>`;
  }

  let lightboxImages = [];
  let lightboxIndex = 0;

  function renderLightboxImage(index){
    if(!lightboxImages.length) return;
    lightboxIndex = (index + lightboxImages.length) % lightboxImages.length;
    $("imageLightboxImg").src = lightboxImages[lightboxIndex];
    $("imageLightboxCount").textContent = `${lightboxIndex + 1} / ${lightboxImages.length}`;
    $("imageLightboxPrev").hidden = lightboxImages.length <= 1;
    $("imageLightboxNext").hidden = lightboxImages.length <= 1;
    Array.from($("imageLightboxThumbs").querySelectorAll(".image-lightbox-thumb")).forEach((thumb,i)=>{
      thumb.classList.toggle("active", i === lightboxIndex);
      if(i === lightboxIndex) thumb.scrollIntoView({behavior:"smooth",block:"nearest",inline:"center"});
    });
  }

  function openImageLightbox(images, startIndex){
    lightboxImages = (images || []).filter(Boolean);
    if(!lightboxImages.length) return;
    $("imageLightboxThumbs").innerHTML = lightboxImages.map((img,i)=>
      `<img class="image-lightbox-thumb ${i===startIndex?"active":""}" src="${escapeHtml(img)}" data-lightbox-index="${i}" alt="Thumbnail ${i+1}">`
    ).join("");
    $("imageLightboxThumbs").querySelectorAll("[data-lightbox-index]").forEach(thumb=>{
      thumb.addEventListener("click", ()=>renderLightboxImage(Number(thumb.dataset.lightboxIndex)));
    });
    $("imageLightbox").hidden = false;
    document.body.style.overflow = "hidden";
    renderLightboxImage(startIndex || 0);
  }

  function closeImageLightbox(){
    $("imageLightbox").hidden = true;
    $("imageLightboxImg").src = "";
    $("imageLightboxThumbs").innerHTML = "";
    lightboxImages = [];
    lightboxIndex = 0;
    document.body.style.overflow = "";
  }

  function openDetailsModal(card){
    detailsCardId = card.id;
    const images = getImages(card);
    const imageHTML = images.length
      ? `<div class="detail-slider" data-card-slider>
          <div class="detail-slider-stage">
            <img class="detail-slider-image" src="${escapeHtml(images[0])}" alt="${escapeHtml(card.name)} image 1">
          </div>
          ${images.length > 1 ? `
            <button type="button" class="detail-slider-btn prev" aria-label="Previous image">‹</button>
            <button type="button" class="detail-slider-btn next" aria-label="Next image">›</button>
            <div class="detail-slider-count">1 / ${images.length}</div>
            <div class="detail-slider-dots">
              ${images.map((_,i)=>`<button type="button" class="detail-slider-dot ${i===0?"active":""}" data-slide="${i}" aria-label="Image ${i+1}"></button>`).join("")}
            </div>` : ""}
        </div>`
      : `<div class="detail-empty-image">No uploaded pictures</div>`;

    const hasGrade = Array.isArray(card.grading) && card.grading.some(g=>g && g.company);
    const condition = CONDITION_LABEL[card.condition] || card.condition || "—";
    const cost = card.cost == null ? "—" : fmtMoney(card.cost);

    detailsMount.innerHTML = `
      <div class="detail-header">
        <div class="detail-title">
          <div class="eyebrow">Card details</div>
          <h2 id="detailsTitle">${escapeHtml(card.name)}</h2>
          <div class="detail-meta">${escapeHtml(card.game || "—")}${card.set ? " · " + escapeHtml(card.set) : ""}</div>
        </div>
        <span class="badge">${escapeHtml(card.rarity || "—")}</span>
      </div>
      <div class="detail-layout">
        <div>${imageHTML}</div>
        <div class="detail-info">
          <div class="detail-grid">
            ${hasGrade ? "" : `<div class="detail-item"><div class="detail-label">Condition</div><div class="detail-value">${escapeHtml(condition)}</div></div>`}
            <div class="detail-item"><div class="detail-label">Quantity</div><div class="detail-value">${escapeHtml(card.qty ?? "0")}</div></div>
            <div class="detail-item"><div class="detail-label">Price</div><div class="detail-value">${fmtMoney(Number(card.price || 0))}</div></div>
            <div class="detail-item"><div class="detail-label">Pictures</div><div class="detail-value">${images.length}</div></div>
          </div>
          ${gradingDetailsHTML(card)}
          ${card.notes ? `<div class="detail-section"><h3>Notes</h3><div class="detail-notes">${escapeHtml(card.notes)}</div></div>` : ""}
        </div>
      </div>
    `;

    detailsOverlay.hidden = false;
    const slider = detailsMount.querySelector("[data-card-slider]");
    if(slider && images.length){
      let slideIndex = 0;
      const slideImg = slider.querySelector(".detail-slider-image");
      const countEl = slider.querySelector(".detail-slider-count");
      const dots = Array.from(slider.querySelectorAll(".detail-slider-dot"));

      function showSlide(index){
        slideIndex = (index + images.length) % images.length;
        slideImg.src = images[slideIndex];
        slideImg.alt = `${card.name} image ${slideIndex + 1}`;
        if(countEl) countEl.textContent = `${slideIndex + 1} / ${images.length}`;
        dots.forEach((d,i)=>d.classList.toggle("active", i === slideIndex));
      }

      const prev = slider.querySelector(".detail-slider-btn.prev");
      const next = slider.querySelector(".detail-slider-btn.next");
      if(prev) prev.addEventListener("click", e=>{ e.stopPropagation(); showSlide(slideIndex - 1); });
      if(next) next.addEventListener("click", e=>{ e.stopPropagation(); showSlide(slideIndex + 1); });
      dots.forEach(d=>d.addEventListener("click", e=>{
        e.stopPropagation();
        showSlide(Number(d.dataset.slide));
      }));

      slideImg.addEventListener("click", ()=>{
        openImageLightbox(images, slideIndex);
      });

      let touchStartX = null;
      slider.addEventListener("touchstart", e=>{
        touchStartX = e.changedTouches[0].clientX;
      }, {passive:true});
      slider.addEventListener("touchend", e=>{
        if(touchStartX == null) return;
        const dx = e.changedTouches[0].clientX - touchStartX;
        if(Math.abs(dx) > 40){
          showSlide(slideIndex + (dx < 0 ? 1 : -1));
        }
        touchStartX = null;
      }, {passive:true});
    }
  }

  function closeDetailsModal(){
    detailsOverlay.hidden = true;
    detailsMount.innerHTML = "";
    detailsCardId = null;
  }

  $("imageLightboxClose").addEventListener("click", closeImageLightbox);
  $("imageLightboxPrev").addEventListener("click", e=>{ e.stopPropagation(); renderLightboxImage(lightboxIndex - 1); });
  $("imageLightboxNext").addEventListener("click", e=>{ e.stopPropagation(); renderLightboxImage(lightboxIndex + 1); });
  $("imageLightbox").addEventListener("click", e=>{
    if(e.target === $("imageLightbox")) closeImageLightbox();
  });

  let lightboxTouchStartX = null;
  $("imageLightboxMain").addEventListener("touchstart", e=>{
    lightboxTouchStartX = e.changedTouches[0].clientX;
  }, {passive:true});
  $("imageLightboxMain").addEventListener("touchend", e=>{
    if(lightboxTouchStartX == null) return;
    const dx = e.changedTouches[0].clientX - lightboxTouchStartX;
    if(Math.abs(dx) > 35 && lightboxImages.length > 1){
      renderLightboxImage(lightboxIndex + (dx < 0 ? 1 : -1));
    }
    lightboxTouchStartX = null;
  }, {passive:true});
  $("detailsCloseBtn").addEventListener("click", closeDetailsModal);
  $("detailsEditBtn").addEventListener("click", ()=>{
    const card = cards.find(c=>c.id === detailsCardId);
    if(card){
      closeDetailsModal();
      openEditModal(card);
    }
  });
  detailsOverlay.addEventListener("click", e=>{
    if(e.target === detailsOverlay) closeDetailsModal();
  });
  document.addEventListener("keydown", e=>{
    if(!$("imageLightbox").hidden){
      if(e.key === "Escape"){ closeImageLightbox(); return; }
      if(e.key === "ArrowLeft" && lightboxImages.length > 1){ renderLightboxImage(lightboxIndex - 1); return; }
      if(e.key === "ArrowRight" && lightboxImages.length > 1){ renderLightboxImage(lightboxIndex + 1); return; }
    }
    if(e.key === "Escape" && !detailsOverlay.hidden) closeDetailsModal();
  });

  // ---------------- Edit modal ----------------
  const overlay = $("modalOverlay");
  const editForm = $("editForm");
  let editFormState = { images: [], grading: [] };

  function openEditModal(card){
    $("editId").value = card.id;
    $("editFieldsMount").innerHTML = fieldsTemplate("edit");
    populateFields("edit", card);
    editFormState = {
      images: getImages(card).slice(),
      grading: Array.isArray(card.grading) ? card.grading.map(g=>({
        company:g.company || "PSA", grade:String(g.grade || "10"), cert:g.cert || ""
      })) : []
    };
    wireImageControls("edit", editFormState);
    wireGradingControls("edit", editFormState);
    overlay.hidden = false;
  }
  function closeEditModal(){ overlay.hidden = true; editForm.reset(); }

  $("cancelBtn").addEventListener("click", closeEditModal);
  overlay.addEventListener("click", (e)=>{ if(e.target === overlay) closeEditModal(); });
  document.addEventListener("keydown", (e)=>{ if(e.key === "Escape" && !overlay.hidden) closeEditModal(); });

  editForm.addEventListener("submit", async (e)=>{
    e.preventDefault();
    const id = $("editId").value;
    const data = collectFields("edit", id, editFormState);
    if(!data.name || !data.game) return;
    if(!isOwnerMode()){ showToast("Owner login required"); return; }
    const saved = await updateCardStorage(data);
    if(saved){
      const idx = cards.findIndex(c=>c.id === id);
      if(idx > -1) cards[idx] = saved;
      showToast("Card updated");
      closeEditModal();
      router();
    }
  });

  wireCardActions(view);
  $("ownerToggle").addEventListener("click", async ()=>{
    if(isOwnerMode()){
      await supabaseClient.auth.signOut();
      ownerSession = null;
      applyOwnerMode();
      if(currentRoute() === "add") location.hash = "#/inventory";
      else router();
      showToast("Logged out");
      return;
    }

    const email = prompt("Owner email:");
    if(email === null) return;
    const password = prompt("Owner password:");
    if(password === null) return;

    const { data, error } = await supabaseClient.auth.signInWithPassword({
      email: email.trim(),
      password
    });

    if(error){
      console.error("Login error:", error);
      showToast("Login failed");
      return;
    }

    ownerSession = data.session;
    applyOwnerMode();
    router();
    showToast("Owner login successful");
  });

  supabaseClient.auth.onAuthStateChange((_event, session)=>{
    ownerSession = session;
    applyOwnerMode();
  });

  async function startApp(){
    await refreshOwnerSession();
    await loadCards();
  }

  startApp();

})();
</script>
