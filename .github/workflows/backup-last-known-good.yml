name: Advance Production Last-Known-Good

on:
  workflow_run:
    workflows:
      - pages build and deployment
    types:
      - completed

permissions:
  contents: write

concurrency:
  group: production-last-known-good
  cancel-in-progress: false

jobs:
  advance:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out deployed Production commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Verify final validated Production release
        id: verify
        shell: bash
        run: |
          set -euo pipefail

          SUBJECT="$(git log -1 --pretty=%s)"
          if [[ ! "$SUBJECT" =~ ^Production\ ([0-9]{4}-[0-9]{2}-[0-9]{2}-v[0-9]{2}):\ record\ package\ validation$ ]]; then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            echo "Pages deployment was not a final Production package-validation commit."
            exit 0
          fi

          VERSION="${BASH_REMATCH[1]}"
          MANIFEST="release-manifests/${VERSION}.txt"
          test -s "$MANIFEST"
          grep -Fxq "Version: ${VERSION}" "$MANIFEST"
          grep -Eq '^Source commit: [0-9a-f]{40}$' "$MANIFEST"
          grep -q '^Full ZIP: Collect-TCG-Production-' "$MANIFEST"
          grep -q '^Patch ZIP: Collect-TCG-Production-' "$MANIFEST"

          git fetch origin production-last-known-good:refs/remotes/origin/production-last-known-good || true
          if git rev-parse --verify refs/remotes/origin/production-last-known-good >/dev/null 2>&1; then
            if ! git merge-base --is-ancestor refs/remotes/origin/production-last-known-good HEAD; then
              echo "eligible=false" >> "$GITHUB_OUTPUT"
              echo "Refusing to move last-known-good backwards or across rewritten history."
              exit 0
            fi
          fi

          echo "eligible=true" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Advance last-known-good branch
        if: steps.verify.outputs.eligible == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git push --force origin HEAD:refs/heads/production-last-known-good
          echo "production-last-known-good advanced to ${{ steps.verify.outputs.version }} at $(git rev-parse HEAD)"
