name: Refresh Production SEO card pages

on:
  workflow_dispatch:
  schedule:
    - cron: '37 3 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/production-seo.yml'
      - 'tools/**'
      - 'migrations/**'
      - 'COLLECT_TCG_BASELINE.md'
      - 'README.md'
      - 'index.html'
      - 'src/**'

permissions:
  actions: read
  contents: write

concurrency:
  group: production-seo-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate rollback anchor
        shell: bash
        run: |
          set -euo pipefail
          test -s docs/BACKUP-RECOVERY.md
          git ls-remote --exit-code origin refs/heads/production-last-known-good
      - name: Validate Production repository and JavaScript
        run: node tools/check-production.mjs
      - name: Validate consolidated CSS
        run: node tools/check-css.mjs
      - name: Validate Game-first Post Generator titles
        run: node tools/check-post-generator-titles.mjs
      - name: Validate SEO generator syntax and self-test
        run: |
          node --check tools/generate-seo.mjs
          node tools/generate-seo.mjs --self-test
      - name: Generate Production SEO card pages
        run: node tools/generate-seo.mjs --production
      - name: Validate generated Production SEO files
        shell: bash
        run: |
          set -euo pipefail
          test -s sitemap.xml
          test -s robots.txt
          test -s seo-slugs.json
          test -s owner-card-routes.json
          grep -q 'Allow: /' robots.txt
          grep -q '<urlset' sitemap.xml
          grep -q 'index,follow,max-image-preview:large' cards/*/index.html
          if grep -Eq '/cards/[^<]*/?--[0-9a-fA-F-]{20,40}/' sitemap.xml; then
            echo "UUID found in public card URL" >&2
            exit 1
          fi
          ! grep -Fq 'analytics_test' src/services/analytics.js
          ! grep -Fq 'isDevelopmentAnalyticsTestSession' src/app/startup.js
          grep -Fq 'registerQrGenerator(appContext)' src/app/register-features.js
          grep -Fq 'collecttcg.github.io/Collect_TCG/' index.html
          grep -Fq 'index,follow,max-image-preview:large' index.html
          git diff --check
      - name: Commit refreshed Production SEO pages
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cards sitemap.xml robots.txt seo-slugs.json owner-card-routes.json
          if git diff --cached --quiet; then
            echo "Production SEO output already current."
          else
            git commit -m "chore: refresh Production SEO card pages [skip ci]"
            git push
          fi
      - name: Create Production release packages
        shell: bash
        env:
          RELEASE_VERSION: 2026-09-29-v10
          PREVIOUS_VERSION: 2026-09-29-v09
          PREVIOUS_COMMIT: 86ce84330e9d0f6ff24febff528bd4137738388a
          DEVELOPMENT_PROMOTED: 2026-09-29-v14
        run: |
          set -euo pipefail
          mkdir -p release
          FULL="release/Collect-TCG-Production-${RELEASE_VERSION}-full.zip"
          PATCH="release/Collect-TCG-Production-${PREVIOUS_VERSION}-to-${RELEASE_VERSION}-patch.zip"
          git archive --format=zip --output="${FULL}" HEAD
          rm -rf .release-patch
          mkdir -p .release-patch
          while IFS= read -r -d '' file; do
            mkdir -p ".release-patch/$(dirname "$file")"
            cp -a "$file" ".release-patch/$file"
          done < <(git diff --name-only --diff-filter=ACMRT -z "${PREVIOUS_COMMIT}" HEAD)
          git diff --name-only --diff-filter=D "${PREVIOUS_COMMIT}" HEAD > .release-patch/PATCH-DELETIONS.txt
          (cd .release-patch && zip -qr "../${PATCH}" .)
          unzip -tq "${FULL}"
          unzip -tq "${PATCH}"
      - name: Upload Production release packages
        uses: actions/upload-artifact@v4
        with:
          name: Collect-TCG-Production-2026-09-29-v10-packages
          path: |
            release/Collect-TCG-Production-2026-09-29-v10-full.zip
            release/Collect-TCG-Production-2026-09-29-v09-to-2026-09-29-v10-patch.zip
          if-no-files-found: error
          retention-days: 30
      - name: Record Production package validation manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-manifests
          MANIFEST="release-manifests/2026-09-29-v10.txt"
          {
            echo "Version: 2026-09-29-v10"
            echo "Previous Production: 2026-09-29-v09"
            echo "Development promoted from: 2026-09-29-v14"
            echo "Source commit: $(git rev-parse HEAD)"
            echo "Full ZIP: Collect-TCG-Production-2026-09-29-v10-full.zip"
            echo "Patch ZIP: Collect-TCG-Production-2026-09-29-v09-to-2026-09-29-v10-patch.zip"
            echo
            sha256sum release/*.zip
          } > "$MANIFEST"
          git add "$MANIFEST"
          git commit -m "Production 2026-09-29-v10: record package validation"
          git push
      - name: Confirm Pages deployment and advance last-known-good
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TARGET_SHA="$(git rev-parse HEAD)"
          echo "Waiting for GitHub Pages deployment of ${TARGET_SHA}"
          for attempt in $(seq 1 60); do
            RESPONSE="$(curl -fsSL -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GH_TOKEN}" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${TARGET_SHA}&per_page=50")"
            STATE="$(printf '%s' "${RESPONSE}" | jq -r '[.workflow_runs[] | select(.name=="pages build and deployment")] | sort_by(.created_at) | last // empty | [.status,.conclusion] | @tsv')"
            if [[ -z "${STATE}" ]]; then sleep 5; continue; fi
            STATUS="${STATE%%$'\t'*}"
            CONCLUSION="${STATE#*$'\t'}"
            if [[ "${STATUS}" == "completed" ]]; then
              if [[ "${CONCLUSION}" != "success" ]]; then
                echo "Pages deployment failed with conclusion: ${CONCLUSION}" >&2
                exit 1
              fi
              git fetch origin production-last-known-good:refs/remotes/origin/production-last-known-good || true
              if git rev-parse --verify refs/remotes/origin/production-last-known-good >/dev/null 2>&1; then
                if ! git merge-base --is-ancestor refs/remotes/origin/production-last-known-good HEAD; then
                  echo "Refusing to move production-last-known-good backwards or across rewritten history." >&2
                  exit 1
                fi
              fi
              git push --force origin HEAD:refs/heads/production-last-known-good
              echo "production-last-known-good advanced to ${TARGET_SHA}"
              exit 0
            fi
            sleep 5
          done
          echo "Timed out waiting for Pages deployment of ${TARGET_SHA}" >&2
          exit 1
