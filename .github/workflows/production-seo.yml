name: Refresh Production SEO card pages

on:
  workflow_dispatch:
  schedule:
    - cron: '37 3 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/production-seo.yml'
      - 'tools/**'
      - 'migrations/**'
      - 'COLLECT_TCG_BASELINE.md'
      - 'README.md'
      - 'index.html'
      - 'src/**'

permissions:
  actions: read
  contents: write

concurrency:
  group: production-seo-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate rollback anchor
        shell: bash
        run: |
          set -euo pipefail
          test -s docs/BACKUP-RECOVERY.md
          git ls-remote --exit-code origin refs/heads/production-last-known-good
      - name: Validate Production repository and JavaScript
        run: node tools/check-production.mjs
      - name: Validate SEO-related JavaScript
        run: |
          node --check src/features/social/posts-hidden-ebay.js
          node --check src/features/owner/card-owner-category.js
          node --check src/features/owner/dashboard.js
          node --check src/features/media/heic-support.js
          node --check src/app/register-features.js
      - name: Validate consolidated CSS
        run: node tools/check-css.mjs
      - name: Validate retained Post Generator titles
        run: node tools/check-post-generator-titles.mjs
      - name: Validate SEO generator syntax and self-test
        run: |
          node --check tools/generate-seo.mjs
          node tools/generate-seo.mjs --self-test
      - name: Generate Production SEO card pages
        run: node tools/generate-seo.mjs --production
      - name: Validate generated Production SEO files
        shell: bash
        run: |
          set -euo pipefail
          test -s sitemap.xml
          test -s robots.txt
          test -s seo-slugs.json
          test -s owner-card-routes.json
          test -s src/features/owner/ebay-banlist.js
          test -s src/features/owner/ebay-banlist.css
          test -s migrations/2026/2026-10-25-v03-EBAY-BANLIST.sql
          grep -q 'Allow: /' robots.txt
          grep -q '<urlset' sitemap.xml
          grep -q 'index,follow,max-image-preview:large' cards/*/index.html
          if grep -Eq '/cards/[^<]*/?--[0-9a-fA-F-]{20,40}/' sitemap.xml; then
            echo "UUID found in public card URL" >&2
            exit 1
          fi
          ! grep -Fq 'analytics_test' src/services/analytics.js
          ! grep -Fq 'isDevelopmentAnalyticsTestSession' src/app/startup.js
          ! grep -Fq 'scan-card-ai-dev' src/features/owner/card-scanner.js
          grep -Fq 'functions.invoke("scan-card-ai"' src/features/owner/card-scanner.js
          grep -Fq 'functionErrorMessage' src/features/owner/card-scanner.js
          grep -Fq 'registerQrGenerator(appContext)' src/app/register-features.js
          grep -Fq 'ebay-banlist.js?v=2026-10-25-v03' src/app/register-features.js
          grep -Fq 'posts-hidden-ebay.js?v=2026-10-27-v02' src/app/register-features.js
          grep -Fq '[IMPORT DUTIES & TAXES]' src/features/social/posts-hidden-ebay.js
          grep -Fq "Import duties, tariffs, taxes, customs clearance fees" src/features/social/posts-hidden-ebay.js
          grep -Fq 'card-owner-category.js?v=2026-10-30-v02' src/app/register-features.js
          grep -Fq 'dashboard.js?v=2026-10-30-v02' src/app/register-features.js
          grep -Fq 'heic-support.js?v=2026-10-30-v03' src/app/register-features.js
          grep -Fq 'heic2any@0.0.4' src/features/media/heic-support.js
          grep -Fq 'const OWNER_CATEGORIES=["Zakwan","Yen","Daniel","Jack","Shue"]' src/features/owner/card-owner-category.js
          grep -Fq 'bulkAssignOwnerCategory' src/features/owner/card-owner-category.js
          grep -Fq 'bulkOwnerCategoryApply' src/features/owner/card-owner-category.js
          grep -Fq 'sub=unassigned' src/features/owner/dashboard.js
          grep -Fq 'collecttcg.github.io/Collect_TCG/' index.html
          grep -Fq 'index,follow,max-image-preview:large' index.html
          git diff --check
      - name: Commit refreshed Production SEO pages
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cards sitemap.xml robots.txt seo-slugs.json owner-card-routes.json
          if git diff --cached --quiet; then
            echo "Production SEO output already current."
          else
            git commit -m "chore: refresh Production SEO card pages [skip ci]"
            git push
          fi