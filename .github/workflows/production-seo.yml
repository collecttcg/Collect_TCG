name: Refresh Production SEO card pages

on:
  workflow_dispatch:
  schedule:
    - cron: '37 3 * * *'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/production-seo.yml'
      - 'tools/generate-seo.mjs'
      - '2026-09-24-v01-SEO-PUBLIC-CATALOG.sql'
      - '2026-09-24-v05-DISCOVERY-ATTRIBUTION.sql'
      - '2026-09-24-v06-DISCOVERY-SUMMARY.sql'
      - 'index.html'
      - 'src/app/register-features.js'
      - 'src/app/initialize.js'
      - 'src/app/startup.js'
      - 'src/app/routing.js'
      - 'src/services/analytics.js'
      - 'src/services/catalogue.js'
      - 'src/features/core/utilities.js'
      - 'src/features/cards/details.js'
      - 'src/features/cards/tiles.js'
      - 'src/features/content/home.js'
      - 'src/features/owner/insights-dashboard.js'
      - 'src/features/social/posts.js'
      - 'src/features/inventory/page.js'
      - 'src/features/inventory/filtering.js'
      - 'src/features/cards/related.js'
      - 'src/main.js'

permissions:
  contents: write

concurrency:
  group: production-seo-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate changed JavaScript
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/generate-seo.mjs
          node --check src/features/core/utilities.js
          node --check src/features/cards/details.js
          node --check src/features/cards/tiles.js
          node --check src/features/content/home.js
          node --check src/features/cards/related.js
          node --check src/features/inventory/filtering.js
          node --check src/features/inventory/page.js
          node --check src/features/owner/insights-dashboard.js
          node --check src/features/social/posts.js
          node --check src/app/routing.js
          node --check src/services/analytics.js
          node --check src/services/catalogue.js
          node --check src/app/startup.js
          node --check src/app/register-features.js
          node --check src/app/initialize.js
          node --check src/main.js
          node tools/generate-seo.mjs --self-test

      - name: Validate imports and HTML assets
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';

          const files=[
            'src/features/core/utilities.js',
            'src/features/cards/details.js',
            'src/features/cards/tiles.js',
            'src/features/content/home.js',
            'src/features/cards/related.js',
            'src/features/inventory/filtering.js',
            'src/features/inventory/page.js',
            'src/features/owner/insights-dashboard.js',
            'src/features/social/posts.js',
            'src/app/routing.js',
            'src/services/analytics.js',
            'src/services/catalogue.js',
            'src/app/startup.js',
            'src/app/register-features.js',
            'src/app/initialize.js',
            'src/main.js'
          ];

          for(const file of files){
            const source=fs.readFileSync(file,'utf8');
            const dir=path.dirname(file);
            const matches=[...source.matchAll(/(?:from\s*|import\s*)['"]([^'"]+)['"]/g)];
            for(const match of matches){
              const spec=match[1];
              if(!spec.startsWith('.')) continue;
              const clean=spec.split(/[?#]/)[0];
              const target=path.resolve(dir,clean);
              if(!fs.existsSync(target)){
                throw new Error(`Missing relative import from ${file}: ${spec}`);
              }
            }
          }

          const html=fs.readFileSync('index.html','utf8');
          for(const match of html.matchAll(/(?:src|href)=["']([^"']+)["']/g)){
            const ref=match[1];
            if(!ref || /^(?:https?:|data:|mailto:|tel:|#|\/\/)/i.test(ref)) continue;
            const clean=ref.split(/[?#]/)[0];
            if(!clean || clean==='/' || clean.startsWith('/')) continue;
            const target=path.resolve(clean.replace(/^\.\//,''));
            if(!fs.existsSync(target)){
              throw new Error(`Missing local HTML asset: ${ref}`);
            }
          }
          console.log('Production imports and local HTML assets verified.');
          NODE

      - name: Validate Phase 2A discovery routing
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const routing=fs.readFileSync('src/app/routing.js','utf8');
          const home=fs.readFileSync('src/features/content/home.js','utf8');
          const tiles=fs.readFileSync('src/features/cards/tiles.js','utf8');
          const details=fs.readFileSync('src/features/cards/details.js','utf8');

          const requireMatch=(source,pattern,label)=>{
            if(!pattern.test(source)) throw new Error(`Missing Phase 2A behavior: ${label}`);
          };
          const requireNoMatch=(source,pattern,label)=>{
            if(pattern.test(source)) throw new Error(`Legacy behavior remains: ${label}`);
          };

          requireMatch(routing,/function rememberCardDiscoverySource\(cardId,source\)/,'discovery source storage');
          requireMatch(routing,/function currentCardDiscoverySource\(\)/,'discovery source detection');
          requireMatch(routing,/openCardRoute\(cardId,discoverySource=""\)/,'discovery-aware card routing');
          requireMatch(routing,/history\.pushState\(state,"",cleanUrl\.pathname\+cleanUrl\.search\+cleanUrl\.hash\)/,'clean card SPA navigation');
          requireNoMatch(routing,/location\.assign\(clean\)/,'full-page clean card navigation');
          requireNoMatch(home,/home-collector-spotlight-media" href="#\/card\//,'Spotlight hash card link');
          requireMatch(home,/data-spotlight-card-id/,'Spotlight routed card id');
          requireMatch(home,/source:"recently-added"/,'Recently Added source');
          requireMatch(home,/source:"trending"/,'Trending source');
          requireMatch(tiles,/data-discovery-source="related"/,'Related Cards source');
          requireMatch(tiles,/openCardRoute\(card\.id,tile\.dataset\.discoverySource\|\|""\)/,'tile discovery propagation');
          requireMatch(details,/rememberCardDiscoverySource\(id,el\.dataset\.discoverySource\|\|"related"\)/,'Related click context');
          console.log('Production Phase 2A discovery routing verified.');
          NODE

      - name: Validate Phase 2B1 discovery attribution
        shell: bash
        run: |
          set -euo pipefail
          test -s 2026-09-24-v05-DISCOVERY-ATTRIBUTION.sql
          grep -q 'create table if not exists public.card_discovery_views' 2026-09-24-v05-DISCOVERY-ATTRIBUTION.sql
          grep -q 'enable row level security' 2026-09-24-v05-DISCOVERY-ATTRIBUTION.sql
          grep -q 'revoke all on table public.card_discovery_views from anon, authenticated' 2026-09-24-v05-DISCOVERY-ATTRIBUTION.sql
          grep -q 'create or replace function public.record_card_discovery_view' 2026-09-24-v05-DISCOVERY-ATTRIBUTION.sql
          grep -q 'grant execute on function public.record_card_discovery_view' 2026-09-24-v05-DISCOVERY-ATTRIBUTION.sql
          grep -q 'recordQualifiedViewDiscoveryAttribution' src/services/analytics.js
          grep -q 'record_card_discovery_view' src/services/analytics.js

      - name: Validate Phase 2 completion
        shell: bash
        run: |
          set -euo pipefail
          test -s 2026-09-24-v06-DISCOVERY-SUMMARY.sql
          grep -q 'create or replace function public.get_card_discovery_summary' 2026-09-24-v06-DISCOVERY-SUMMARY.sql
          grep -q 'public.is_app_owner()' 2026-09-24-v06-DISCOVERY-SUMMARY.sql
          grep -q 'revoke all on function public.get_card_discovery_summary' 2026-09-24-v06-DISCOVERY-SUMMARY.sql
          grep -q 'grant execute on function public.get_card_discovery_summary' 2026-09-24-v06-DISCOVERY-SUMMARY.sql
          grep -q 'function relatedSeriesAffinity' src/features/cards/related.js
          grep -q 'function relatedGradeAffinity' src/features/cards/related.js
          grep -Fq 'unique*100' src/features/inventory/filtering.js
          grep -q 'trendingCardScore(b)-appContext.trendingCardScore(a)' src/features/content/home.js
          grep -q 'unique qualified collector interest' src/features/inventory/page.js
          grep -q 'fetchDiscoverySourceSummary' src/services/analytics.js
          grep -q 'Where card interest starts' src/features/owner/insights-dashboard.js
          grep -q 'directional context while traffic is still small' src/features/owner/insights-dashboard.js

      - name: Validate fast clean-card navigation
        shell: bash
        run: |
          set -euo pipefail
          node --check src/app/routing.js
          node --check src/features/cards/details.js
          node --check src/features/content/home.js
          node --check src/app/initialize.js
          grep -Fq 'history.pushState(state,"",cleanUrl.pathname+cleanUrl.search+cleanUrl.hash)' src/app/routing.js
          grep -q 'state.collectTcgSpaCardId=id' src/app/routing.js
          grep -q 'window.addEventListener("popstate", appContext.router)' src/app/routing.js
          ! grep -q 'location.assign(clean)' src/app/routing.js
          grep -q 'history.back()' src/features/cards/details.js
          grep -q 'event.stopPropagation()' src/features/content/home.js
          grep -q 'routing.js?v=2026-09-24-v07' src/app/initialize.js
          grep -q 'details.js?v=2026-09-24-v08' src/app/initialize.js
          grep -q 'routing.js?v=2026-09-24-v07' src/app/register-features.js
          grep -q 'home.js?v=2026-09-24-v07' src/app/register-features.js
          grep -q 'details.js?v=2026-09-24-v08' src/app/register-features.js

      - name: Validate Phase 3 conversion and performance
        shell: bash
        run: |
          set -euo pipefail
          node --check src/features/cards/details.js
          node --check src/services/analytics.js
          node --check src/services/catalogue.js
          node --check src/features/cards/tiles.js
          node --check src/features/owner/insights-dashboard.js
          node --check src/app/startup.js
          grep -q 'function contactCardReferenceLines' src/features/cards/details.js
          grep -q 'recordCardEngagement(card.id,"inquiry_copy",platform)' src/features/cards/details.js
          grep -q 'fetchOwnerCardConversionSummary' src/services/analytics.js
          grep -q 'ownerCardConversionSummaryCache = new Map' src/services/analytics.js
          grep -q 'data-owner-conversion="intent-rate"' src/features/cards/details.js
          grep -q 'cardImageLoadPromises.get(id)' src/services/catalogue.js
          grep -q 'preloadCardDetailsMedia' src/features/cards/tiles.js
          grep -q 'Saved without contact' src/features/owner/insights-dashboard.js
          grep -q 'const directCardEntry=' src/app/startup.js
          grep -q 'Promise.allSettled' src/app/startup.js
          grep -q 'analytics.js?v=2026-09-24-v08' src/app/register-features.js
          grep -q 'catalogue.js?v=2026-09-24-v08' src/app/register-features.js
          grep -q 'tiles.js?v=2026-09-24-v08' src/app/register-features.js
          grep -q 'insights-dashboard.js?v=2026-09-25-v01' src/app/register-features.js
          grep -q 'details.js?v=2026-09-24-v08' src/app/register-features.js
          grep -q 'startup.js?v=2026-09-24-v08' src/app/register-features.js
          grep -q 'register-features.js?v=2026-09-25-v03' src/main.js
          grep -q 'initialize.js?v=2026-09-24-v08' src/main.js
          grep -q 'src/main.js?v=2026-09-25-v03' index.html

      - name: Validate Phase 4 owner sales intelligence
        shell: bash
        run: |
          set -euo pipefail
          node --check src/features/owner/insights-dashboard.js
          grep -q 'function cardPerformanceRows' src/features/owner/insights-dashboard.js
          grep -q 'const pageSize=10' src/features/owner/insights-dashboard.js
          grep -q 'insights-v20-performance-controls' src/features/owner/insights-dashboard.js
          grep -q 'data-insights-v20-pagination' src/features/owner/insights-dashboard.js
          grep -q 'insights-dashboard.js?v=2026-09-25-v01' src/app/register-features.js
          grep -q 'register-features.js?v=2026-09-25-v03' src/main.js
          grep -q 'src/main.js?v=2026-09-25-v03' index.html

      - name: Validate Facebook group-friendly post generator
        shell: bash
        run: |
          set -euo pipefail
          node --check src/features/social/posts.js
          grep -q 'function facebookGroupSalesCopy' src/features/social/posts.js
          grep -q 'function facebookGroupSalesFooterLines' src/features/social/posts.js
          grep -q 'Group-friendly (short)' src/features/social/posts.js
          grep -q 'Detailed listing' src/features/social/posts.js
          grep -Fq 'Price & full details:' src/features/social/posts.js
          grep -Fq 'Worldwide shipping available' src/features/social/posts.js
          grep -Fq 'more photos / video' src/features/social/posts.js
          grep -q '<option value="detailed" selected>Detailed listing</option>' src/features/social/posts.js
          grep -q 'templateModeInput?.value||"detailed"' src/features/social/posts.js
          grep -q 'posts.js?v=2026-09-25-v03' src/app/register-features.js
          grep -q 'register-features.js?v=2026-09-25-v03' src/main.js
          grep -q 'src/main.js?v=2026-09-25-v03' index.html

      - name: Generate Production SEO card pages
        run: node tools/generate-seo.mjs --production

      - name: Validate generated Production SEO files
        shell: bash
        run: |
          set -euo pipefail
          test -s sitemap.xml
          test -s robots.txt
          test -s seo-slugs.json
          grep -q 'Allow: /' robots.txt
          grep -q '<urlset' sitemap.xml
          grep -q 'index,follow,max-image-preview:large' cards/*/index.html
          if grep -Eq '/cards/[^<]*/?--[0-9a-fA-F-]{20,40}/' sitemap.xml; then
            echo "UUID found in public card URL" >&2
            exit 1
          fi
          git diff --check

      - name: Commit refreshed Production SEO pages
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cards sitemap.xml robots.txt seo-slugs.json
          if git diff --cached --quiet; then
            echo "Production SEO output already current."
          else
            git commit -m "chore: refresh Production SEO card pages [skip ci]"
            git push
          fi

      # Production v02 packaging from completed v01.
      - name: Create Production release packages
        shell: bash
        env:
          RELEASE_VERSION: 2026-09-25-v03
          PREVIOUS_VERSION: 2026-09-25-v02
          PREVIOUS_COMMIT: 5b330fa358fabd2d9f1f9302fd0de8be952a91e1
          BETA_PROMOTED: 2026-09-25-v03
        run: |
          set -euo pipefail
          mkdir -p release
          FULL="release/Collect-TCG-Production-${RELEASE_VERSION}-full.zip"
          PATCH="release/Collect-TCG-Production-${PREVIOUS_VERSION}-to-${RELEASE_VERSION}-patch.zip"

          git archive --format=zip --output="${FULL}" HEAD

          rm -rf .release-patch
          mkdir -p .release-patch
          while IFS= read -r -d '' file; do
            mkdir -p ".release-patch/$(dirname "$file")"
            cp -a "$file" ".release-patch/$file"
          done < <(git diff --name-only --diff-filter=ACMRT -z "${PREVIOUS_COMMIT}" HEAD)

          git diff --name-only --diff-filter=D "${PREVIOUS_COMMIT}" HEAD > .release-patch/PATCH-DELETIONS.txt
          (
            cd .release-patch
            zip -qr "../${PATCH}" .
          )

          unzip -tq "${FULL}"
          unzip -tq "${PATCH}"

      - name: Upload Production release packages
        uses: actions/upload-artifact@v4
        with:
          name: Collect-TCG-Production-2026-09-25-v03-packages
          path: |
            release/Collect-TCG-Production-2026-09-25-v03-full.zip
            release/Collect-TCG-Production-2026-09-25-v02-to-2026-09-25-v03-patch.zip
          if-no-files-found: error
          retention-days: 30

      - name: Record Production package validation manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-manifests
          MANIFEST="release-manifests/2026-09-25-v03.txt"
          {
            echo "Version: 2026-09-25-v03"
            echo "Previous Production: 2026-09-25-v02"
            echo "Beta promoted from: 2026-09-25-v03"
            echo "Source commit: $(git rev-parse HEAD)"
            echo "Full ZIP: Collect-TCG-Production-2026-09-25-v03-full.zip"
            echo "Patch ZIP: Collect-TCG-Production-2026-09-25-v02-to-2026-09-25-v03-patch.zip"
            echo
            sha256sum release/*.zip
          } > "$MANIFEST"
          git add "$MANIFEST"
          git commit -m "Production 2026-09-25-v03: record package validation"
          git push
