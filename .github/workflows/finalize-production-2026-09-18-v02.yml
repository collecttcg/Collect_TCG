name: Finalize Production 2026-09-18-v02

on:
  push:
    branches: [release-validate-2026-09-18-v02]

jobs:
  validate-promote-package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore exact Production v02 candidate
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "69ad42e5dcca944406bda05c9800e895ece777ea"
          git reset --hard 3967f28ee9b12adfde9a3de5ed92d8da3e901598
          test "$(git rev-parse HEAD~5)" = "69ad42e5dcca944406bda05c9800e895ece777ea"

      - name: Validate intended scope
        run: |
          set -euo pipefail
          expected="$(printf '%s\n' PRODUCTION-DEPLOY.txt index.html src/app/register-features.js src/main.js src/services/analytics.js | sort | tr '\n' ' ')"
          actual="$(git diff --name-only 69ad42e5dcca944406bda05c9800e895ece777ea..HEAD | sort | tr '\n' ' ')"
          test "$actual" = "$expected" || { echo "Unexpected scope: $actual"; exit 1; }

      - name: Validate Production code and assets
        run: |
          set -euo pipefail
          ! grep -R -nE '^(<<<<<<< .+|=======|>>>>>>> .+)$' index.html src PRODUCTION-DEPLOY.txt
          find src -name '*.js' -print0 | xargs -0 -n1 node --check

          python3 - <<'PY'
          from pathlib import Path
          import re,sys
          errors=[]
          for p in Path('src').rglob('*.js'):
              text=p.read_text(errors='ignore')
              pattern=r'(?:import|export)\s+(?:[^"\']*?\s+from\s+)?["\'](\.[^"\']+)["\']'
              for spec in re.findall(pattern,text):
                  clean=spec.split('?')[0]
                  target=(p.parent/clean).resolve()
                  ok=target.exists() if target.suffix else (target.exists() or target.with_suffix('.js').exists() or (target/'index.js').exists())
                  if not ok: errors.append(f'Missing import {spec} from {p}')
          html=Path('index.html').read_text(errors='ignore')
          for attr in re.findall(r'(?:src|href)=["\']([^"\']+)["\']',html):
              clean=attr.split('?')[0].split('#')[0]
              if not clean or clean.startswith(('http://','https://','//','mailto:','tel:','data:','javascript:')): continue
              target=Path(clean[2:] if clean.startswith('./') else clean)
              if not target.exists(): errors.append(f'Missing HTML asset {attr}')
          if errors:
              print('\n'.join(errors)); sys.exit(1)
          print('JavaScript syntax, relative imports and HTML assets OK')
          PY

      - name: Verify exact approved Beta analytics
        run: |
          set -euo pipefail
          curl -fsSL "https://raw.githubusercontent.com/collecttcg/Collect_TCG_Beta/6a730fa60278b739a791318abea383036f7e3bd3/beta/src/services/analytics.js" -o /tmp/beta-v04-analytics.js
          cmp src/services/analytics.js /tmp/beta-v04-analytics.js

      - name: Validate Meta crawler filter and real Facebook traffic
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { register } from './src/services/analytics.js';

          const appContext={
            isOwnerAuthenticated:()=>false,
            isAnalyticsExcludedDevice:()=>false
          };
          register(appContext);

          const setUA=ua=>Object.defineProperty(globalThis,'navigator',{
            value:{userAgent:ua},
            configurable:true
          });

          const blocked=[
            'facebookexternalhit/1.1 (+http://www.facebook.com/externalhit_uatext.php)',
            'facebookcatalog/1.0',
            'Facebot',
            'FacebookBot/1.0',
            'meta-externalagent/1.1',
            'Meta-ExternalFetcher/1.1',
            'meta-webindexer/1.1',
            'meta-externalads/1.1'
          ];
          const allowed=[
            'Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 [FBAN/FBIOS;FBAV/500.0.0.0.0]',
            'Mozilla/5.0 (Linux; Android 15) AppleWebKit/537.36 [FBAN/FB4A;FBAV/500.0.0.0.0]',
            'Instagram 400.0.0.0.0 Android',
            'Mozilla/5.0 Chrome/152.0 Safari/537.36'
          ];

          for(const ua of blocked){
            setUA(ua);
            if(!appContext.isKnownAutomatedSocialFetcher()) throw new Error('Expected blocked Meta crawler: '+ua);
            if(!appContext.isBuyerAnalyticsBlocked()) throw new Error('Expected analytics blocked: '+ua);
          }

          for(const ua of allowed){
            setUA(ua);
            if(appContext.isKnownAutomatedSocialFetcher()) throw new Error('Real browser incorrectly blocked: '+ua);
            if(appContext.isBuyerAnalyticsBlocked()) throw new Error('Real browser analytics incorrectly blocked: '+ua);
          }

          console.log('Meta crawler filtering and in-app browser preservation OK');
          NODE

      - name: Validate retained Production behavior
        run: |
          set -euo pipefail
          grep -Fq 'analytics.js?v=2026-09-18-v02' src/app/register-features.js
          grep -Fq 'qr-generator.js?v=2026-09-17-v04' src/app/register-features.js
          grep -Fq 'register-features.js?v=2026-09-18-v02' src/main.js
          grep -Fq 'src/main.js?v=2026-09-18-v02' index.html

          grep -R -q 'Owner Mode' src index.html
          grep -R -q 'Availability' src index.html
          grep -R -q 'Make an offer' src index.html
          grep -R -q 'More photos / video' src index.html
          grep -R -q 'COD / meetup' src index.html

          grep -Fq 'const count=appContext.$("sfCount");' src/app/routing.js
          grep -Fq 'if(count) count.textContent=' src/app/routing.js
          grep -Fq 'Browse Collection by game' src/features/inventory/page.js
          grep -Fq 'const groupedView=collectionRearrangeMode;' src/features/inventory/page.js
          grep -q 'record-visitor-country' src/services/analytics.js
          grep -q 'record-card-view' src/services/analytics.js
          test -f src/features/owner/insights-dashboard.js
          test -f src/features/owner/qr-generator.js

      - name: Squash and promote Production v02
        run: |
          set -euo pipefail
          git config user.name collecttcg
          git config user.email z3313514@gmail.com
          git reset --soft 69ad42e5dcca944406bda05c9800e895ece777ea
          git commit -m 'Production 2026-09-18-v02: promote Beta 2026-09-18-v04'
          git push origin HEAD:main

      - name: Build release archives
        run: |
          set -euo pipefail
          mkdir -p /tmp/pkg/full /tmp/pkg/patch
          rsync -a --exclude='.git' --exclude='.github/workflows/finalize-production-2026-09-18-v02.yml' ./ /tmp/pkg/full/
          (cd /tmp/pkg/full && zip -qr /tmp/Collect-TCG-Production-2026-09-18-v02-full.zip .)

          for f in PRODUCTION-DEPLOY.txt index.html src/app/register-features.js src/main.js src/services/analytics.js; do
            mkdir -p "/tmp/pkg/patch/$(dirname "$f")"
            cp "$f" "/tmp/pkg/patch/$f"
          done
          (cd /tmp/pkg/patch && zip -qr /tmp/Collect-TCG-Production-2026-09-18-v01-to-2026-09-18-v02-patch.zip .)

          unzip -t /tmp/Collect-TCG-Production-2026-09-18-v02-full.zip
          unzip -t /tmp/Collect-TCG-Production-2026-09-18-v01-to-2026-09-18-v02-patch.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Collect-TCG-Production-2026-09-18-v02-release
          path: |
            /tmp/Collect-TCG-Production-2026-09-18-v02-full.zip
            /tmp/Collect-TCG-Production-2026-09-18-v01-to-2026-09-18-v02-patch.zip
