name: Production Release
# Production 2026-11-14-v01 — eBay listing negotiation guidance.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/release-production.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: production-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate rollback anchor
        run: |
          set -euo pipefail
          test -s docs/BACKUP-RECOVERY.md
          git ls-remote --exit-code origin refs/heads/production-last-known-good
      - name: Validate Production JavaScript
        run: |
          set -euo pipefail
          for file in $(find src -name '*.js' -type f); do node --check "$file"; done
          node --check tools/generate-seo.mjs
          node --check tools/check-production.mjs
          node --check tools/check-seo-workflow.mjs
      - name: Validate Production and retained contracts
        shell: bash
        run: |
          set -euo pipefail
          node tools/check-production.mjs
          node tools/check-seo-workflow.mjs
          grep -Fq 'posts-ebay-link.js?v=' src/app/register-features.js
          grep -Fq 'module61.register(appContext)' src/app/register-features.js
          grep -Fq '🛒 eBay Listing:' src/features/social/posts-ebay-link.js
          grep -Fq '.select("created_at")' src/services/analytics.js
          grep -Fq 'const daysListed=validCreatedAt' src/services/analytics.js
          ! sed -n '/async function captureSaleConversionSnapshot(card)/,/function getAnalyticsSessionId()/p' src/services/analytics.js | grep -Fq '2000-01-01'
          grep -Fq 'analytics.js?v=' src/app/register-features.js
          grep -Fq 'For additional security and documentation' src/features/owner/dashboard.js
          grep -Fq 'Messages · ban list · listing status' src/features/owner/ebay-messages.js
          grep -Fq "['messages','eBay Messages']" src/features/owner/ebay-messages.js
          grep -Fq "['banlist','eBay Ban List']" src/features/owner/ebay-messages.js
          grep -Fq "['listing-status','eBay Listing Status']" src/features/owner/ebay-messages.js
          grep -Fq 'positive feedback for our store' src/features/owner/ebay-messages.js
          grep -Fq 'It will be shipped over the weekend.' src/features/owner/ebay-messages.js
          grep -Fq '#/inventory-tools?mode=ebay&sub=banlist' src/features/owner/ebay-banlist.js
          ! grep -Fq 'addNavLink(document.getElementById("premiumDesktopMoreMenu")' src/features/owner/ebay-banlist.js
          ! grep -Fq 'addNavLink(document.getElementById("mainnav")' src/features/owner/ebay-banlist.js
          grep -Fq '<span>Reason / note <small>(optional)</small></span><input name="reason"' src/features/owner/ebay-banlist.js
          grep -Fq 'ebay-messages.js?v=' src/app/register-features.js
          grep -Fq 'ebay-banlist.js?v=' src/app/register-features.js
          grep -Fq '"[NEGOTIATION]"' src/features/social/posts-marketplace.js
          grep -Fq 'We welcome reasonable offers.' src/features/social/posts-marketplace.js
          grep -Fq 'posts-marketplace.js?v=' src/features/social/posts.js
          grep -Fq 'posts.js?v=' src/app/register-features.js
          grep -Fq 'forms.js?v=' src/app/register-features.js
          grep -Fq 'add.js?v=' src/app/register-features.js
          grep -Fq 'function wirePreErrataError(p)' src/features/owner/forms.js
          grep -Fq 'else appContext.wirePreErrataError("add")' src/features/owner/add.js
          grep -Fq '[PRE ERRATA] [ERROR]' src/features/owner/forms.js
          grep -Fq 'const EBAY_BLOCKED_BUYERS_URL="https://www.ebay.com/bmgt/BuyerBlock"' src/features/owner/ebay-banlist.js
          grep -Fq 'length:EBAY_ACCOUNT_COUNT' src/features/owner/ebay-banlist.js
          grep -Fq 'href="${EBAY_BLOCKED_BUYERS_URL}"' src/features/owner/ebay-banlist.js
          grep -Fq 'if(!appContext.isOwnerMode())' src/features/owner/ebay-banlist.js
          grep -Fq 'module60.register(appContext)' src/app/register-features.js
          grep -Fq 'video recorded before dispatch' src/features/social/posts-hidden-ebay.js
          grep -Fq '[IMPORT DUTIES & TAXES]' src/features/social/posts-hidden-ebay.js
          grep -Fq 'FX_NORMAL_CONVERSION_BELOW_MYR=400' src/features/owner/fx-low-price.js
          grep -Fq 'Math.round(raw)' src/features/owner/fx-low-price.js
          grep -Fq 'notesWithEbayListing' src/features/owner/ebay-listing-status.js
          grep -Fq 'class="detail-ebay-cta"' src/features/cards/details.js
          grep -Fq 'target="_blank" rel="noopener noreferrer"' src/features/cards/details.js
          grep -Fq 'details.js?v=' src/app/register-features.js
          grep -Fq '02-components.css?v=' index.html
          grep -Fq 'id="detailsDownloadAllBtn"' index.html
          grep -Fq 'Download all listing images' index.html
          grep -Fq 'downloadSingleCardImagesZip(card,null,{includeInventoryQr:false})' src/features/cards/details.js
          grep -Fq '.details-download-all-desktop{display:none;}' src/styles/02-components.css
          grep -Fq -- '--detail-purchase-action-height:78px' src/styles/02-components.css
          grep -Fq 'preserveNextRouterScroll' src/features/owner/quick-action-scroll.js
          ! grep -Fq 'analytics-test-exclusion' src/app/register-features.js
          ! grep -Fq 'scan-card-ai-dev' src/features/owner/card-scanner.js
          grep -Fq 'functions.invoke("scan-card-ai"' src/features/owner/card-scanner.js
          grep -Fq 'registerQrGenerator(appContext)' src/app/register-features.js
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const source=fs.readFileSync('src/features/social/posts-card-list.js','utf8');
          const full=source.split('function buildFbCardListPost(')[1].split('function buildFbCardDropPost(')[0];
          const drop=source.split('function buildFbCardDropPost(')[1].split('function balancedCardDropCards(')[0];
          for(const section of [full,drop]) assert.equal((section.match(/\.\.\.officialEbayAccountLines\(\)/g)||[]).length,1);
          assert.equal((source.match(/View our seller history and feedback/g)||[]).length,0);
          for(let i=1;i<=5;i++) assert.match(source,new RegExp('COLLECT_TCG_'+i+': https://www\\.ebay\\.'));
          assert.match(fs.readFileSync('src/features/social/posts.js','utf8'),/posts-card-list\.js\?v=[^\x27"]+/);
          NODE
          node tools/check-css.mjs
          node tools/check-post-generator-titles.mjs
          git diff --check
      - name: Hidden Listings shared Inventory and Owner isolation contracts
        run: |
          set -euo pipefail
          grep -Fq 'return appContext.renderInventoryPage("hidden-listings");' src/features/owner/lifecycle.js
          grep -Fq 'if(!appContext.requireOwner("open Hidden Listings")) return;' src/features/owner/lifecycle.js
          grep -Fq 'if(scope === "hidden-listings") return lifecycle === "draft";' src/features/inventory/filtering.js
          grep -Fq '["inventory","collection","hidden-listings"].includes(scope)' src/features/inventory/page-shell.js
          grep -Fq '["inventory","collection","hidden-listings"].includes(appContext.listingAvailabilityScope)' src/features/inventory/page.js
          grep -Fq 'hiddenOwnerCategoryFilter' src/features/inventory/page-shell.js
          grep -Fq 'hiddenOwnerCategory' src/features/inventory/filtering.js
          grep -Fq 'hiddenOwnerCategoryFilter' src/features/inventory/page.js
          grep -Fq 'if(appContext.isOwnerMode()) appContext.renderHiddenListingsPage();' src/app/routing.js
          grep -Fq 'repository.js?v=' src/app/register-features.js
          grep -Fq 'filtering.js?v=' src/app/register-features.js
          grep -Fq 'page.js?v=' src/app/register-features.js
          grep -Fq 'lifecycle.js?v=' src/app/register-features.js
          grep -Fq 'page-shell.js?v=' src/features/inventory/page.js
          grep -Fq 'register-features.js?v=' src/main.js
          grep -Fq 'main.js?v=' index.html
          ! grep -Fq 'analytics-test-exclusion' src/app/register-features.js

      - name: Insights country attribution promotion contract
        run: |
          set -euo pipefail
          grep -Fq 'insights.js?v=' src/app/register-features.js
          grep -Fq 'function recentQualifiedCountryLabel(cardId)' src/features/owner/insights.js
          grep -Fq 'appContext.fetchCountryCardViewInsights(startDate,endDate)' src/features/owner/insights.js
          grep -Fq 'recentQualifiedCountriesSupported:recentQualifiedCountryResult.supported' src/features/owner/insights.js
          grep -Fq 'const country=latest?.country_code' src/features/owner/insights.js
          grep -Fq 'Country unknown' src/features/owner/insights.js
          grep -Fq 'registerQrGenerator(appContext)' src/app/register-features.js
          ! grep -Fq 'analytics-test-exclusion' src/app/register-features.js
      - name: SEO validation and regeneration
        run: |
          set -euo pipefail
          node tools/generate-seo.mjs --self-test
          node tools/generate-seo.mjs --production
          test -s sitemap.xml
          test -s robots.txt
          test -s seo-slugs.json
          test -s owner-card-routes.json
          grep -q 'Allow: /' robots.txt
          grep -q '<urlset' sitemap.xml
          grep -q 'index,follow,max-image-preview:large' cards/*/index.html
          if grep -Eq '/cards/[^<]*/?--[0-9a-fA-F-]{20,40}/' sitemap.xml; then exit 1; fi
      - name: Commit refreshed SEO pages
        run: |
          set -euo pipefail
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add cards sitemap.xml robots.txt seo-slugs.json owner-card-routes.json
            git commit -m 'chore: refresh Production SEO card pages [skip ci]'
            git pull --rebase origin main
            git push
          fi
      - name: Create and verify packages
        env:
          RELEASE_VERSION: 2026-11-14-v01
          PREVIOUS_VERSION: 2026-11-12-v06
          PREVIOUS_COMMIT: e427081abe02098e2eaee5eae35d97aa12caa7ce
        run: |
          set -euo pipefail
          rm -rf .release-patch release
          mkdir -p release .release-patch
          FULL="release/Collect-TCG-Production-${RELEASE_VERSION}-full.zip"
          PATCH="release/Collect-TCG-Production-${PREVIOUS_VERSION}-to-${RELEASE_VERSION}-patch.zip"
          git archive --format=zip --output="$FULL" HEAD
          while IFS= read -r -d '' file; do mkdir -p ".release-patch/$(dirname "$file")"; cp -a "$file" ".release-patch/$file"; done < <(git diff --name-only --diff-filter=ACMRT -z "$PREVIOUS_COMMIT" HEAD)
          git diff --name-only --diff-filter=D "$PREVIOUS_COMMIT" HEAD > .release-patch/PATCH-DELETIONS.txt
          (cd .release-patch && zip -qr "../$PATCH" .)
          unzip -tq "$FULL"
          unzip -tq "$PATCH"
          sha256sum "$FULL" "$PATCH" | tee release/checksums.txt
      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: Collect-TCG-Production-2026-11-14-v01-packages
          path: |
            release/Collect-TCG-Production-2026-11-14-v01-full.zip
            release/Collect-TCG-Production-2026-11-12-v06-to-2026-11-14-v01-patch.zip
            release/checksums.txt
          if-no-files-found: error
          retention-days: 30
      - name: Record immutable Production manifest
        run: |
          set -euo pipefail
          git pull --rebase origin main
          MANIFEST='release-manifests/2026-11-14-v01.txt'
          test ! -e "$MANIFEST"
          {
            echo 'Version: 2026-11-14-v01'
            echo 'Previous Production: 2026-11-12-v06'
            echo 'Development promoted from: 2026-11-14-v01 (source a9e2d7fd08aedd9c9b45596a5481be2b1d18b635)'
            echo 'Purpose: promote compact desktop filters and the five official eBay accounts on About Us.'
            echo "Source commit: $(git rev-parse HEAD)"
            echo 'Full ZIP: Collect-TCG-Production-2026-11-14-v01-full.zip'
            echo 'Patch ZIP: Collect-TCG-Production-2026-11-12-v06-to-2026-11-14-v01-patch.zip'
            echo 'SQL required: No'
            echo 'Validation: rollback anchor; Production JavaScript syntax; Production/retained contracts; direct eBay card-detail CTA, compact mobile action, and desktop-only all-listing-images ZIP download contracts; Insights country attribution contract; Facebook/eBay and snapshot contracts; SEO workflow guard and SEO self-test/regeneration/output; package integrity.'
            echo 'Validation limitations: no manual live Production open; no interactive desktop/mobile/Safari browser test.'
            echo
            cat release/checksums.txt
          } > "$MANIFEST"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$MANIFEST"
          git commit -m 'Production 2026-11-14-v01: record package validation'
          git pull --rebase origin main
          git push
      - name: Confirm Pages deployment and advance last-known-good
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TARGET_SHA="${GITHUB_SHA}" # Pages deploys the release source; manifest commit uses GITHUB_TOKEN and does not trigger a Pages run.
          for attempt in $(seq 1 60); do
            RESPONSE="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${TARGET_SHA}&per_page=50")"
            STATE="$(printf '%s' "$RESPONSE" | jq -r '[.workflow_runs[] | select(.name=="pages build and deployment")] | sort_by(.created_at) | last // empty | [.status,.conclusion] | @tsv')"
            if [[ -z "$STATE" ]]; then sleep 5; continue; fi
            STATUS="${STATE%%$'\t'*}"; CONCLUSION="${STATE#*$'\t'}"
            if [[ "$STATUS" == 'completed' ]]; then
              test "$CONCLUSION" = 'success'
              git push --force origin HEAD:refs/heads/production-last-known-good
              exit 0
            fi
            sleep 5
          done
          exit 1
