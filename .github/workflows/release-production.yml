name: Production Release
# Production 2026-11-01-v02 — promote validated Development state 1427c2649715e4c081327dde5224bc5c5546a0c1.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/release-production.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: production-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Promote validated Development changes
        shell: bash
        run: |
          set -euo pipefail
          DEV_SHA='1427c2649715e4c081327dde5224bc5c5546a0c1'
          BASE="https://raw.githubusercontent.com/collecttcg/Collect_TCG_Dev/${DEV_SHA}/dev/src"
          curl --fail --silent --show-error --location --max-time 30 "$BASE/features/social/posts-hidden-ebay.js" -o src/features/social/posts-hidden-ebay.js
          curl --fail --silent --show-error --location --max-time 30 "$BASE/features/owner/dashboard.js" -o src/features/owner/dashboard.js
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/app/register-features.js')
          s=p.read_text()
          s=s.replace("../features/social/posts-hidden-ebay.js?v=2026-10-27-v02", "../features/social/posts-hidden-ebay.js?v=2026-11-01-v01")
          s=s.replace("../features/owner/dashboard.js?v=2026-10-30-v02", "../features/owner/dashboard.js?v=2026-11-01-v01")
          p.write_text(s)
          PY
          node --check src/features/social/posts-hidden-ebay.js
          node --check src/features/owner/dashboard.js
          node --check src/app/register-features.js
          grep -Fq "posts-hidden-ebay.js?v=2026-11-01-v01" src/app/register-features.js
          grep -Fq "dashboard.js?v=2026-11-01-v01" src/app/register-features.js
          git diff --check
          git config user.name 'collecttcg'
          git config user.email 'z3313514@gmail.com'
          git add src/features/social/posts-hidden-ebay.js src/features/owner/dashboard.js src/app/register-features.js
          git commit -m 'Promote latest Development buyer and eBay messaging to Production'
          git push
      - name: Validate rollback anchor
        run: |
          set -euo pipefail
          test -s docs/BACKUP-RECOVERY.md
          git ls-remote --exit-code origin refs/heads/production-last-known-good
      - name: Validate Production JavaScript
        run: |
          set -euo pipefail
          for file in $(find src -name '*.js' -type f); do node --check "$file"; done
          node --check tools/generate-seo.mjs
      - name: Validate promoted and retained contracts
        shell: bash
        run: |
          set -euo pipefail
          node tools/check-production.mjs
          grep -Fq 'For additional security and documentation' src/features/owner/dashboard.js
          grep -Fq 'video recorded before dispatch' src/features/social/posts-hidden-ebay.js
          grep -Fq '[IMPORT DUTIES & TAXES]' src/features/social/posts-hidden-ebay.js
          grep -Fq 'Mark On eBay' src/features/cards/tiles.js
          grep -Fq 'Remove On eBay' src/features/cards/tiles.js
          grep -Fq 'notesWithEbayListing' src/features/owner/ebay-listing-status.js
          grep -Fq 'preserveNextRouterScroll' src/features/owner/quick-action-scroll.js
          ! grep -Fq 'analytics-test-exclusion' src/app/register-features.js
          ! grep -Fq 'scan-card-ai-dev' src/features/owner/card-scanner.js
          grep -Fq 'functions.invoke("scan-card-ai"' src/features/owner/card-scanner.js
          grep -Fq 'registerQrGenerator(appContext)' src/app/register-features.js
          node tools/check-css.mjs
          node tools/check-post-generator-titles.mjs
          git diff --check
      - name: SEO validation and regeneration
        run: |
          set -euo pipefail
          node tools/generate-seo.mjs --self-test
          node tools/generate-seo.mjs --production
          test -s sitemap.xml
          test -s robots.txt
          test -s seo-slugs.json
          test -s owner-card-routes.json
          grep -q 'Allow: /' robots.txt
          git diff --check
      - name: Commit refreshed SEO pages
        run: |
          set -euo pipefail
          if ! git diff --quiet; then
            git add cards sitemap.xml robots.txt seo-slugs.json owner-card-routes.json
            git commit -m 'chore: refresh Production SEO card pages [skip ci]'
            git push
          fi
      - name: Create and verify packages
        env:
          RELEASE_VERSION: 2026-11-01-v02
          PREVIOUS_VERSION: 2026-11-01-v01
          PREVIOUS_COMMIT: df8e6108ac560da7ef95b290ea7f7ea7df957f6b
        run: |
          set -euo pipefail
          rm -rf .release-patch release
          mkdir -p release .release-patch
          FULL="release/Collect-TCG-Production-${RELEASE_VERSION}-full.zip"
          PATCH="release/Collect-TCG-Production-${PREVIOUS_VERSION}-to-${RELEASE_VERSION}-patch.zip"
          git archive --format=zip --output="$FULL" HEAD
          while IFS= read -r -d '' file; do mkdir -p ".release-patch/$(dirname "$file")"; cp -a "$file" ".release-patch/$file"; done < <(git diff --name-only --diff-filter=ACMRT -z "$PREVIOUS_COMMIT" HEAD)
          git diff --name-only --diff-filter=D "$PREVIOUS_COMMIT" HEAD > .release-patch/PATCH-DELETIONS.txt
          (cd .release-patch && zip -qr "../$PATCH" .)
          unzip -tq "$FULL"
          unzip -tq "$PATCH"
          sha256sum "$FULL" "$PATCH" | tee release/checksums.txt
      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: Collect-TCG-Production-2026-11-01-v02-packages
          path: |
            release/Collect-TCG-Production-2026-11-01-v02-full.zip
            release/Collect-TCG-Production-2026-11-01-v01-to-2026-11-01-v02-patch.zip
            release/checksums.txt
          if-no-files-found: error
          retention-days: 30
      - name: Record immutable Production manifest
        run: |
          set -euo pipefail
          git pull --rebase origin main
          MANIFEST='release-manifests/2026-11-01-v02.txt'
          test ! -e "$MANIFEST"
          {
            echo 'Version: 2026-11-01-v02'
            echo 'Previous Production: 2026-11-01-v01'
            echo 'Development promoted from: latest validated Development state 1427c2649715e4c081327dde5224bc5c5546a0c1'
            echo "Source commit: $(git rev-parse HEAD)"
            echo 'Full ZIP: Collect-TCG-Production-2026-11-01-v02-full.zip'
            echo 'Patch ZIP: Collect-TCG-Production-2026-11-01-v01-to-2026-11-01-v02-patch.zip'
            echo 'SQL required: No'
            echo 'Validation: all Production JavaScript syntax; Production repository/contracts; Buyer Messages/eBay generator contracts; CSS/Post Generator checks; SEO self-test/regeneration; package integrity.'
            echo 'Validation limitations: no manual live Production open; no interactive desktop/mobile/Safari browser test during promotion.'
            echo
            cat release/checksums.txt
          } > "$MANIFEST"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$MANIFEST"
          git commit -m 'Production 2026-11-01-v02: record package validation'
          git push
      - name: Confirm Pages deployment and advance last-known-good
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TARGET_SHA="$(git rev-parse HEAD)"
          for attempt in $(seq 1 60); do
            RESPONSE="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${TARGET_SHA}&per_page=50")"
            STATE="$(printf '%s' "$RESPONSE" | jq -r '[.workflow_runs[] | select(.name=="pages build and deployment")] | sort_by(.created_at) | last // empty | [.status,.conclusion] | @tsv')"
            if [[ -z "$STATE" ]]; then sleep 5; continue; fi
            STATUS="${STATE%%$'\t'*}"; CONCLUSION="${STATE#*$'\t'}"
            if [[ "$STATUS" == 'completed' ]]; then
              test "$CONCLUSION" = 'success'
              git push --force origin HEAD:refs/heads/production-last-known-good
              exit 0
            fi
            sleep 5
          done
          exit 1
