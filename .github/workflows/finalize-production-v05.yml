name: Finalize Production v05

on:
  push:
    branches:
      - release-validate-production-2026-09-17-v05
    paths:
      - .github/workflows/finalize-production-v05.yml

permissions:
  contents: write

jobs:
  validate-promote-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact Production v04 main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Checkout approved Beta v18
        uses: actions/checkout@v4
        with:
          repository: collecttcg/Collect_TCG_Beta
          ref: b4bbac19e31b6b313c6f86d3735b89d483f1221b
          path: beta-v18
          persist-credentials: false
      - name: Checkout Beta v13 baseline
        uses: actions/checkout@v4
        with:
          repository: collecttcg/Collect_TCG_Beta
          ref: fd8c2151d872845edd46064d8027c0d8061a6f51
          path: beta-v13
          persist-credentials: false
      - name: Promote approved Beta delta safely
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "1f8779e57af81c28b11e9afbaa4111f6a955dcf6"
          cmp src/services/analytics.js beta-v13/beta/src/services/analytics.js
          cp beta-v18/beta/src/services/analytics.js src/services/analytics.js
          cp beta-v18/beta/src/features/owner/insights-dashboard.js src/features/owner/insights-dashboard.js
          cp beta-v18/beta/src/styles/27-insights-dashboard.css src/styles/27-insights-dashboard.css
          cp beta-v18/beta/src/styles/28-inventory-game-logo-fit.css src/styles/28-inventory-game-logo-fit.css
          cp beta-v18/beta/2026-09-17-v18-COUNTRY-CARD-DEMAND.sql 2026-09-17-v05-COUNTRY-CARD-DEMAND.sql
          python - <<'PY'
          from pathlib import Path
          import difflib
          old=Path('beta-v13/beta/src/features/owner/insights-intent-rates.js').read_text()
          new=Path('beta-v18/beta/src/features/owner/insights-intent-rates.js').read_text()
          Path('/tmp/rates.patch').write_text(''.join(difflib.unified_diff(old.splitlines(True),new.splitlines(True),fromfile='src/features/owner/insights-intent-rates.js',tofile='src/features/owner/insights-intent-rates.js')))
          PY
          patch -p0 --forward < /tmp/rates.patch
          rm -f src/features/owner/insights-intent-rates.js.orig
          python - <<'PY'
          from pathlib import Path
          p=Path('src/app/register-features.js'); s=p.read_text()
          s=s.replace("import { register as register12 } from '../services/analytics.js';", "import { register as register12 } from '../services/analytics.js?v=2026-09-17-v05';")
          s=s.replace("import { register as registerInsightsIntentRates } from '../features/owner/insights-intent-rates.js?v=2026-09-17-v04';", "import { register as registerInsightsIntentRates } from '../features/owner/insights-intent-rates.js?v=2026-09-17-v05';\nimport { register as registerInsightsDashboard } from '../features/owner/insights-dashboard.js?v=2026-09-17-v05';")
          s=s.replace("  registerInsightsIntentRates(appContext);\n  register28(appContext);", "  registerInsightsIntentRates(appContext);\n  if(typeof document!==\"undefined\") registerInsightsDashboard(appContext);\n  register28(appContext);")
          p.write_text(s)
          p=Path('src/main.js'); p.write_text(p.read_text().replace("./app/register-features.js?v=2026-09-17-v04", "./app/register-features.js?v=2026-09-17-v05"))
          p=Path('index.html'); s=p.read_text(); anchor='<link rel="stylesheet" href="./src/styles/26-compatibility.css?v=210">'; addition=anchor+'\n<link rel="stylesheet" href="./src/styles/27-insights-dashboard.css?v=2026-09-17-v05">\n<link rel="stylesheet" href="./src/styles/28-inventory-game-logo-fit.css?v=2026-09-17-v05">';
          if '27-insights-dashboard.css' not in s: s=s.replace(anchor,addition)
          p.write_text(s)
          p=Path('PRODUCTION-DEPLOY.txt'); p.write_text(p.read_text().rstrip()+"\n\n2026-09-17-v05 release record\n=============================\nPrevious Production: 2026-09-17-v04\nPromoted from approved Beta: 2026-09-17-v18\nScope: approved Beta v14-v18 Insights/dashboard/logo-fit changes only; Production v03/v04 routing, QR Generator, Owner Mode, Supabase/RLS, giveaways and Contact-to-Buy behavior preserved.\nSQL: 2026-09-17-v05-COUNTRY-CARD-DEMAND.sql must be run in Supabase for Country → Card/Era demand.\n")
          PY
      - name: Verify exact promotion scope
        shell: bash
        run: |
          set -euo pipefail
          { git diff --name-only; git ls-files --others --exclude-standard | grep -vE '^beta-v(13|18)/' || true; } | sort -u > /tmp/changed.txt
          cat /tmp/changed.txt
          test "$(wc -l < /tmp/changed.txt)" -eq 10
          for f in 2026-09-17-v05-COUNTRY-CARD-DEMAND.sql PRODUCTION-DEPLOY.txt index.html src/app/register-features.js src/features/owner/insights-dashboard.js src/features/owner/insights-intent-rates.js src/main.js src/services/analytics.js src/styles/27-insights-dashboard.css src/styles/28-inventory-game-logo-fit.css; do grep -Fxq "$f" /tmp/changed.txt; done
          grep -Fq '<h4>Card era</h4>' src/features/owner/insights-dashboard.js
          grep -Fq '<h4>Price bands</h4>' src/features/owner/insights-dashboard.js
          grep -Fq '<h4>Card views by country</h4>' src/features/owner/insights-dashboard.js
          grep -Fq 'get_country_card_view_insights' src/services/analytics.js
          grep -Fq 'if not public.is_app_owner() then' 2026-09-17-v05-COUNTRY-CARD-DEMAND.sql
          grep -Fq 'registerQrGenerator(appContext);' src/app/register-features.js
          grep -Fq "./app/initialize.js?v=2026-09-17-v03" src/main.js
          ! grep -Fq 'subtree:true' src/features/owner/insights-dashboard.js
          ! grep -Fq 'subtree:true' src/features/owner/insights-intent-rates.js
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: JavaScript syntax checks
        shell: bash
        run: |
          set -euo pipefail
          find src -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Relative import and HTML asset checks
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re,sys
          errors=[]
          for js in Path('src').rglob('*.js'):
              text=js.read_text(errors='ignore')
              for spec in re.findall(r"(?:from\s+|import\s*\()\s*['\"]([^'\"]+)['\"]",text):
                  if not spec.startswith('.'): continue
                  clean=spec.split('?',1)[0].split('#',1)[0]
                  target=(js.parent/clean).resolve()
                  if not target.exists(): errors.append(f'missing import: {js} -> {spec}')
          html=Path('index.html').read_text(errors='ignore')
          for ref in re.findall(r'(?:src|href)=["\'](\./[^"\'#?]+)',html):
              if ref.startswith('./#'): continue
              target=Path(ref[2:])
              if not target.exists(): errors.append(f'missing HTML asset: {ref}')
          if errors:
              print('\n'.join(errors)); sys.exit(1)
          print('Relative imports and local HTML assets resolved.')
          PY
          ! grep -R -n -E '^(<<<<<<<|=======|>>>>>>>)' src index.html 2026-09-17-v05-COUNTRY-CARD-DEMAND.sql
      - name: Retained Production behavior markers
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'Availability' index.html
          grep -Fq 'Make an offer' index.html
          grep -Fq 'More photos / video' index.html
          grep -Fq 'COD / meetup' index.html
          grep -Fq 'if(count)' src/app/routing.js
          grep -R -Fq 'owner-mode' src/styles
          grep -Fq 'qr-generator.js?v=2026-09-17-v04' src/app/register-features.js
          grep -Fq 'Malaysia' index.html
          grep -Fq 'Singapore' index.html
      - name: Commit Production v05
        shell: bash
        run: |
          set -euo pipefail
          git config user.name collecttcg
          git config user.email z3313514@gmail.com
          git add 2026-09-17-v05-COUNTRY-CARD-DEMAND.sql PRODUCTION-DEPLOY.txt index.html src/app/register-features.js src/features/owner/insights-dashboard.js src/features/owner/insights-intent-rates.js src/main.js src/services/analytics.js src/styles/27-insights-dashboard.css src/styles/28-inventory-game-logo-fit.css
          test "$(git diff --cached --name-only | wc -l)" -eq 10
          git commit -m 'Production 2026-09-17-v05: promote Beta 2026-09-17-v18'
          git push origin HEAD:main
      - name: Build Production release archives
        shell: bash
        run: |
          set -euo pipefail
          HEAD_SHA=$(git rev-parse HEAD); mkdir -p release/patch
          zip -qr release/Collect-TCG-Production-2026-09-17-v05-full.zip . -x '.git/*' '.github/*' 'beta-v13/*' 'beta-v18/*' 'release/*'
          git diff --name-only 1f8779e57af81c28b11e9afbaa4111f6a955dcf6 "$HEAD_SHA" > /tmp/v05-files.txt
          test "$(wc -l < /tmp/v05-files.txt)" -eq 10
          while IFS= read -r file; do [ -z "$file" ] && continue; mkdir -p "release/patch/$(dirname "$file")"; cp "$file" "release/patch/$file"; done < /tmp/v05-files.txt
          (cd release/patch && zip -qr ../Collect-TCG-Production-2026-09-17-v04-to-2026-09-17-v05-patch.zip .)
          unzip -t release/Collect-TCG-Production-2026-09-17-v05-full.zip
          unzip -t release/Collect-TCG-Production-2026-09-17-v04-to-2026-09-17-v05-patch.zip
      - name: Upload Production v05 release package
        uses: actions/upload-artifact@v4
        with:
          name: Collect-TCG-Production-2026-09-17-v05-release
          path: |
            release/Collect-TCG-Production-2026-09-17-v05-full.zip
            release/Collect-TCG-Production-2026-09-17-v04-to-2026-09-17-v05-patch.zip
            2026-09-17-v05-COUNTRY-CARD-DEMAND.sql
          if-no-files-found: error
